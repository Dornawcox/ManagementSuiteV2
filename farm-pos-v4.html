  <script>
    // ============================================
    // SUPABASE INTEGRATION - AUTO-CONNECTS FROM FARMHACK ADMIN
    // ============================================
    window.SUPABASE_POS = (function() {
      var CRED_KEY = 'farmhack-supabase-v1';
      var sb = null;
      var connected = false;
      var tablesExist = false;
      var errorMsg = null;
      
      function getCreds() {
        try { return JSON.parse(localStorage.getItem(CRED_KEY)) || null; }
        catch(e) { return null; }
      }
      
      var creds = getCreds();
      
      // Auto-initialize if credentials exist
      if (creds && creds.url && creds.anonKey && window.supabase) {
        try {
          sb = window.supabase.createClient(creds.url, creds.anonKey);
          connected = true;
          console.log('[POS] Supabase client initialized from FarmHack credentials');
        } catch(e) {
          errorMsg = e.message;
          console.error('[POS] Supabase init failed:', e);
        }
      } else if (!creds || !creds.url) {
        errorMsg = 'No Supabase credentials. Configure in FarmHack Admin.';
      }
      
      return {
        client: sb,
        connected: connected,
        tablesExist: tablesExist,
        error: errorMsg,
        creds: creds,
        
        // Check if POS tables exist
        checkTables: async function() {
          if (!sb) return false;
          try {
            var result = await sb.from('pos_products').select('id').limit(1);
            if (result.error) {
              this.tablesExist = false;
              this.error = 'POS tables not found. Run schema in FarmHack Admin → POS.';
              return false;
            }
            this.tablesExist = true;
            this.error = null;
            return true;
          } catch(e) {
            this.tablesExist = false;
            this.error = e.message;
            return false;
          }
        },
        
        // Fetch products from Supabase
        fetchProducts: async function() {
          if (!sb || !this.tablesExist) return null;
          try {
            var result = await sb.from('pos_products').select('*').eq('is_active', true);
            if (result.error) throw result.error;
            return result.data;
          } catch(e) {
            console.error('[POS] fetchProducts error:', e);
            return null;
          }
        },
        
        // Fetch vendors from Supabase
        fetchVendors: async function() {
          if (!sb || !this.tablesExist) return null;
          try {
            var result = await sb.from('pos_vendors').select('*').eq('is_active', true);
            if (result.error) throw result.error;
            return result.data;
          } catch(e) {
            console.error('[POS] fetchVendors error:', e);
            return null;
          }
        },
        
        // Fetch categories from Supabase
        fetchCategories: async function() {
          if (!sb || !this.tablesExist) return null;
          try {
            var result = await sb.from('pos_categories').select('*').eq('is_active', true).order('sort_order');
            if (result.error) throw result.error;
            return result.data;
          } catch(e) {
            console.error('[POS] fetchCategories error:', e);
            return null;
          }
        },
        
        // Save transaction to Supabase
        saveTransaction: async function(transaction, items) {
          if (!sb || !this.tablesExist) return { success: false, error: 'Not connected' };
          try {
            // Insert transaction
            var txResult = await sb.from('pos_transactions').insert(transaction).select().single();
            if (txResult.error) throw txResult.error;
            
            // Insert line items with transaction ID
            var itemsWithTxId = items.map(function(item) {
              return { ...item, transaction_id: txResult.data.id };
            });
            var itemsResult = await sb.from('pos_transaction_items').insert(itemsWithTxId);
            if (itemsResult.error) throw itemsResult.error;
            
            return { success: true, transaction: txResult.data };
          } catch(e) {
            console.error('[POS] saveTransaction error:', e);
            return { success: false, error: e.message };
          }
        },
        
        // Update product stock
        updateStock: async function(productId, newStock) {
          if (!sb || !this.tablesExist) return false;
          try {
            var result = await sb.from('pos_products').update({ stock: newStock }).eq('id', productId);
            return !result.error;
          } catch(e) {
            return false;
          }
        }
      };
    })();

                    name: p.name,
                    price: parseFloat(p.price),
                    unit: p.unit,
                    unitType: p.unit_type,
                    stock: p.stock,

        const vendor = vendors[product.vendorId];
        if (!isWeight) {

          if (existingIndex >= 0) { const newCart = [...cart]; newCart[existingIndex].quantity += quantity; newCart[existingIndex].total = newCart[existingIndex].quantity * product.price; setCart(newCart); return; }
        }
        setCart([...cart, { ...product, cartId: `cart_${Date.now()}_${Math.random()}`, quantity: isWeight ? actualQuantity : quantity, total: lineTotal, isWeight, vendorName: vendor?.name || 'Unknown', vendorColor: vendor?.color || '#666', commissionRate: vendor?.commissionRate || 0 }]);
      };

      const updateCartItem = (cartId, updates) => { setCart(cart.map(item => { if (item.cartId === cartId) { const newItem = { ...item, ...updates }; newItem.total = newItem.price * newItem.quantity; return newItem; } return item; })); };

            <h2 style={{ margin: '0 0 16px', fontSize: '18px' }}>⚙️ Admin Settings</h2>
            <div style={{ display: 'flex', gap: '6px', marginBottom: '16px', flexWrap: 'wrap' }}>{adminSections.map(sec => (<button key={sec.id} style={{ ...styles.button, ...(adminSection === sec.id ? styles.primaryBtn : styles.secondaryBtn), fontSize: '11px' }} onClick={() => setAdminSection(sec.id)}>{sec.label}</button>))}</div>

            {adminSection === 'store' && (<div style={styles.card}><h3 style={{ margin: '0 0 16px', fontSize: '15px' }}>🏪 Store Information</h3><div style={{ display: 'grid', gap: '12px' }}><div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>Store Name</label><input style={styles.input} value={localSettings.storeName} onChange={e => setLocalSettings({ ...localSettings, storeName: e.target.value })} /></div><div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>Address</label><input style={styles.input} value={localSettings.storeAddress} onChange={e => setLocalSettings({ ...localSettings, storeAddress: e.target.value })} /></div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>Phone</label><input style={styles.input} value={localSettings.storePhone} onChange={e => setLocalSettings({ ...localSettings, storePhone: e.target.value })} /></div><div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>Email</label><input style={styles.input} value={localSettings.storeEmail} onChange={e => setLocalSettings({ ...localSettings, storeEmail: e.target.value })} /></div></div><button style={{ ...styles.button, ...styles.primaryBtn, marginTop: '8px' }} onClick={saveAdminSettings} disabled={adminSaving}>{adminSaving ? 'Saving...' : '💾 Save Store Settings'}</button></div></div>)}

            {adminSection === 'users' && (<div style={styles.card}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}><h3 style={{ margin: 0, fontSize: '15px' }}>👥 User Management</h3><button style={{ ...styles.button, ...styles.primaryBtn }} onClick={() => setEditingUser({})}>➕ Add User</button></div><div style={{ display: 'grid', gap: '8px' }}>{users.map(u => (<div key={u.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px', background: '#f8f7f4', borderRadius: '8px', cursor: 'pointer' }} onClick={() => setEditingUser(u)}><div><div style={{ fontWeight: '600', fontSize: '13px' }}>{u.name}</div><div style={{ fontSize: '11px', color: '#666' }}>@{u.username} • {u.email || 'No email'}</div></div><div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}><span style={{ padding: '3px 10px', borderRadius: '10px', fontSize: '10px', fontWeight: '600', background: u.role === 'admin' ? '#fef3c7' : u.role === 'manager' ? '#e0e7ff' : '#f0fdf4', color: u.role === 'admin' ? '#92400e' : u.role === 'manager' ? '#4338ca' : '#166534' }}>{u.role}</span>{!u.active && <span style={{ padding: '3px 8px', borderRadius: '10px', fontSize: '9px', background: '#fef2f2', color: '#b91c1c' }}>Inactive</span>}</div></div>))}</div></div>)}

            {adminSection === 'devices' && (<div style={styles.card}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}><h3 style={{ margin: 0, fontSize: '15px' }}>🔌 Peripheral Devices</h3><button style={{ ...styles.button, ...styles.primaryBtn }} onClick={() => setEditingDevice({})}>➕ Add Device</button></div><div style={{ fontSize: '13px', color: '#666', padding: '20px', textAlign: 'center', background: '#f8f7f4', borderRadius: '8px' }}>Configure barcode scanners, receipt printers, scales, and card readers.</div></div>)}

            {adminSection === 'payments' && (<div style={styles.card}><h3 style={{ margin: '0 0 16px', fontSize: '15px' }}>💳 Payment Processing</h3><div style={{ display: 'grid', gap: '12px' }}><div style={{ fontSize: '12px', fontWeight: '600', marginBottom: '4px' }}>Select Payment Processor</div><div style={{ display: 'grid', gap: '8px' }}>{PAYMENT_PROCESSORS.map(proc => (<div key={proc.id} onClick={() => setLocalSettings({ ...localSettings, paymentProcessor: proc.id })} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '14px', borderRadius: '10px', border: localSettings.paymentProcessor === proc.id ? '2px solid #0f6e56' : '2px solid #e0ddd5', cursor: 'pointer', background: localSettings.paymentProcessor === proc.id ? '#f0fdf4' : 'white' }}><div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}><span style={{ fontSize: '24px' }}>{proc.logo}</span><div><div style={{ fontWeight: '600', fontSize: '14px' }}>{proc.name} {proc.recommended && <span style={{ color: '#0f6e56', fontSize: '12px' }}>★ Recommended</span>}</div><div style={{ fontSize: '11px', color: '#666' }}>{proc.features}</div></div></div><div style={{ textAlign: 'right' }}><div style={{ fontWeight: '700', color: '#0f6e56' }}>{proc.rate}</div><div style={{ fontSize: '10px', color: '#888' }}>per transaction</div></div></div>))}</div><button style={{ ...styles.button, ...styles.primaryBtn, marginTop: '8px' }} onClick={saveAdminSettings} disabled={adminSaving}>{adminSaving ? 'Saving...' : '💾 Save Payment Settings'}</button></div></div>)}

            {adminSection === 'database' && (<div style={styles.card}>
              <h3 style={{ margin: '0 0 16px', fontSize: '15px' }}>🗄️ Database Connection</h3>
              <div style={{ display: 'grid', gap: '12px' }}>
                <div style={{ padding: '16px', borderRadius: '8px', background: dbStatus.connected && dbStatus.tablesExist ? '#dcfce7' : dbStatus.connected ? '#fef3c7' : '#fef2f2' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                      <div style={{ fontWeight: '600', fontSize: '14px', color: dbStatus.connected && dbStatus.tablesExist ? '#166534' : dbStatus.connected ? '#92400e' : '#b91c1c' }}>
                        {dbStatus.loading ? '⏳ Checking...' : dbStatus.connected && dbStatus.tablesExist ? '✓ Connected to Supabase' : dbStatus.connected ? '⚠️ Supabase Connected (No POS Tables)' : '✗ Not Connected'}
                      </div>
                      {dbStatus.error && <div style={{ fontSize: '11px', color: '#666', marginTop: '4px' }}>{dbStatus.error}</div>}
                      {dbStatus.connected && !dbStatus.tablesExist && (
                        <div style={{ fontSize: '11px', color: '#666', marginTop: '4px' }}>
                          Run the POS schema in FarmHack Admin → POS → Copy POS SQL Schema
                        </div>
                      )}
                    </div>
                    <button style={{ ...styles.button, ...styles.secondaryBtn }} onClick={testDbConnection} disabled={testingDb}>
                      {testingDb ? 'Testing...' : 'Test Connection'}
                    </button>
                  </div>
                </div>
                
                <div style={{ background: '#f8f7f4', padding: '14px', borderRadius: '8px' }}>
                  <div style={{ fontSize: '12px', fontWeight: '600', marginBottom: '8px' }}>Supabase Credentials</div>
                  <div style={{ fontSize: '11px', color: '#666' }}>
                    {window.SUPABASE_POS?.creds?.url ? (
                      <>
                        <div><strong>URL:</strong> {window.SUPABASE_POS.creds.url}</div>
                        <div><strong>Key:</strong> {window.SUPABASE_POS.creds.anonKey?.substring(0, 20)}...</div>
                        <div style={{ marginTop: '8px', color: '#0f6e56' }}>✓ Credentials loaded from FarmHack Admin</div>
                      </>
                    ) : (
                      <>
                        <div>No credentials found.</div>
                        <div style={{ marginTop: '8px' }}>
                          <a href="farmhack-admin.html" target="_blank" style={{ color: '#0f6e56', fontWeight: '600' }}>
                            → Configure in FarmHack Admin
                          </a>
                        </div>
                      </>
                    )}
                  </div>
                </div>
                
                <div style={{ background: '#f0f9ff', padding: '12px', borderRadius: '8px', fontSize: '11px', color: '#0369a1' }}>
                  <strong>💡 How it works:</strong> The POS automatically uses Supabase credentials from FarmHack Admin. Configure credentials once, use everywhere.
                </div>
              </div>
            </div>)}
          </div>
        );
      };

      // PAYMENT MODAL
      const PaymentModal = () => {
        const [processing, setProcessing] = useState(false);
        const [paymentMethod, setPaymentMethod] = useState('card');
        
        const processPayment = async () => {
          setProcessing(true);
          
          // Build transaction data
          const txNum = `TX${Date.now()}`;
          const transaction = {
            transaction_num: txNum,
            subtotal: cartTotal,
            tax_amount: 0,
            total: cartTotal,
            payment_method: paymentMethod,
            status: 'completed',
            is_kiosk: view === 'kiosk'
          };
          
          const items = cart.map(item => ({
            product_id: item.id,
            vendor_id: item.vendorId,
            quantity: item.quantity,
            unit_price: item.price,
            line_total: item.total,
            commission_rate: item.commissionRate,
            commission_amt: item.total * (item.commissionRate / 100),
            is_weight: item.isWeight
          }));
          
          // Save to Supabase if connected
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.saveTransaction(transaction, items);
            if (result.success) {
              console.log('[POS] Transaction saved to Supabase:', result.transaction.id);
            } else {
              console.error('[POS] Failed to save transaction:', result.error);
            }
          }
          
          // Simulate payment processing
          await new Promise(r => setTimeout(r, 1500));
          
          // Clear cart
          setCart([]);
          setShowPayment(false);
          setProcessing(false);
        };
        
        return (
          <div style={styles.modal} onClick={() => !processing && setShowPayment(false)}>
            <div style={{ ...styles.modalContent, maxWidth: '400px' }} onClick={e => e.stopPropagation()}>
              <h2 style={{ margin: '0 0 20px', fontSize: '18px', textAlign: 'center' }}>💳 Payment</h2>
              <div style={{ textAlign: 'center', padding: '20px', background: '#f0fdf4', borderRadius: '12px', marginBottom: '20px' }}>
                <div style={{ fontSize: '14px', color: '#666' }}>Total Due</div>
                <div style={{ fontSize: '36px', fontWeight: '700', color: '#0f6e56' }}>${cartTotal.toFixed(2)}</div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '20px' }}>
                <button onClick={() => setPaymentMethod('card')} style={{ ...styles.button, padding: '16px', fontSize: '14px', background: paymentMethod === 'card' ? '#0f6e56' : '#f5f5f4', color: paymentMethod === 'card' ? 'white' : '#333' }}>💳 Card</button>
                <button onClick={() => setPaymentMethod('cash')} style={{ ...styles.button, padding: '16px', fontSize: '14px', background: paymentMethod === 'cash' ? '#0f6e56' : '#f5f5f4', color: paymentMethod === 'cash' ? 'white' : '#333' }}>💵 Cash</button>
              </div>
              <button onClick={processPayment} disabled={processing} style={{ ...styles.button, ...styles.primaryBtn, width: '100%', padding: '16px', fontSize: '16px', opacity: processing ? 0.7 : 1 }}>
                {processing ? '⏳ Processing...' : `Pay $${cartTotal.toFixed(2)}`}
              </button>
              {dbStatus.connected && dbStatus.tablesExist && (
                <div style={{ textAlign: 'center', marginTop: '12px', fontSize: '11px', color: '#0f6e56' }}>
                  ✓ Transaction will be saved to Supabase
                </div>
              )}
            </div>
          </div>
        );
      };

      // MAIN RENDER
      return (
        <div style={styles.app}>
          <DatabaseStatus dbStatus={dbStatus} />
          <header style={styles.header}><div style={styles.logo}><span style={{ fontSize: '22px' }}>🌱</span><div><div>{settings.storeName.split(' ').slice(0, 3).join(' ')}</div><div style={{ fontSize: '9px', opacity: 0.8, fontWeight: '400' }}>{user.role.charAt(0).toUpperCase() + user.role.slice(1)}: {user.name}</div></div></div><div style={styles.tabs}>{availableViews.map(tab => (<button key={tab.id} style={{ ...styles.tab, ...(view === tab.id ? styles.tabActive : styles.tabInactive) }} onClick={() => setView(tab.id)}>{tab.label}</button>))}</div><button style={{ ...styles.button, background: 'rgba(255,255,255,0.15)', color: 'white', fontSize: '11px' }} onClick={logout}>Logout</button></header>
          {view === 'pos' && renderPOS()}
          {view === 'kiosk' && renderKiosk()}
          {view === 'vendors' && renderVendors()}
          {view === 'inventory' && renderInventory()}
          {view === 'admin' && renderAdmin()}
          {showPayment && <PaymentModal />}
          {scaleProduct && (
            <div style={styles.modal} onClick={() => setScaleProduct(null)}>
              <div style={{ ...styles.modalContent, maxWidth: '350px' }} onClick={e => e.stopPropagation()}>
                <h2 style={{ margin: '0 0 16px', fontSize: '16px' }}>⚖️ Weigh: {scaleProduct.name}</h2>
                <div style={{ textAlign: 'center', padding: '30px', background: '#f8f7f4', borderRadius: '12px', marginBottom: '16px' }}>
                  <div style={{ fontSize: '48px', fontWeight: '700', color: '#0f6e56' }}>{weight.toFixed(2)}</div>
                  <div style={{ fontSize: '14px', color: '#666' }}>{scaleProduct.unit}</div>
                  <div style={{ fontSize: '12px', color: stable ? '#22c55e' : '#f59e0b', marginTop: '8px' }}>{stable ? '✓ Stable' : '⏳ Stabilizing...'}</div>
                </div>
                <div style={{ textAlign: 'center', marginBottom: '16px' }}>
                  <span style={{ fontSize: '14px', color: '#666' }}>Total: </span>
                  <span style={{ fontSize: '20px', fontWeight: '700', color: '#0f6e56' }}>${(scaleProduct.price * weight).toFixed(2)}</span>
                </div>
                <div style={{ display: 'flex', gap: '10px' }}>
                  <button style={{ ...styles.button, ...styles.secondaryBtn, flex: 1 }} onClick={() => { setWeight((Math.random() * 2 + 0.5).toFixed(2) * 1); }}>Simulate Weigh</button>
                  <button style={{ ...styles.button, ...styles.primaryBtn, flex: 1 }} disabled={!stable || weight <= 0} onClick={() => { addToCart(scaleProduct, 1, weight); setScaleProduct(null); setWeight(0); }}>Add to Cart</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // APP WITH AUTH
    function App() {
      const [user, setUser] = useState(null);
      const login = (user) => setUser(user);
      const logout = () => setUser(null);
      const hasPermission = (perm) => {
        if (!user) return false;
        const perms = ROLE_PERMISSIONS[user.role] || [];
        return perms.includes('all') || perms.includes(perm);
      };

      return (
        <AuthContext.Provider value={{ user, login, logout, hasPermission }}>
          {user ? <MainApp /> : <LoginScreen onLogin={login} />}
        </AuthContext.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
