<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Farm POS v7.8</title>
  <meta name="description" content="Cooperative Farm Store POS with multi-vendor consignment, role-based access, and peripheral device management">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    console.log('[POS] === VERSION 7.8 LOADING ===');
    
    // Check for URL parameters to set Supabase credentials
    (function() {
      const params = new URLSearchParams(window.location.search);
      const sbUrl = params.get('sb_url');
      const sbKey = params.get('sb_key');
      if (sbUrl && sbKey) {
        console.log('[POS] Found Supabase credentials in URL parameters');
        localStorage.setItem('farmhack-supabase-v1', JSON.stringify({ url: sbUrl, anonKey: sbKey }));
        // Remove params from URL to keep it clean (optional)
        // window.history.replaceState({}, '', window.location.pathname);
      }
    })();
    
    // ============================================
    // SUPABASE LAZY CONNECTOR
    // Does NOT connect on script load - call init() from React useEffect
    // ============================================
    window.SUPABASE_POS = {
      client: null,
      connected: false,
      tablesExist: false,
      error: null,
      creds: null,
      _initialized: false,
      
      init: function() {
        if (this._initialized) return this.connected;
        this._initialized = true;
        
        try {
          this.creds = JSON.parse(localStorage.getItem('farmhack-supabase-v1')) || null;
        } catch(e) { this.creds = null; }
        
        if (!this.creds || !this.creds.url || !this.creds.anonKey) {
          this.error = 'No credentials. Configure in FarmHack Admin.';
          return false;
        }
        
        if (typeof supabase === 'undefined') {
          this.error = 'Supabase library not loaded';
          return false;
        }
        
        try {
          this.client = supabase.createClient(this.creds.url, this.creds.anonKey);
          this.connected = true;
          this.error = null;
          console.log('[POS] Supabase connected');
          return true;
        } catch(e) {
          this.error = e.message;
          return false;
        }
      },
      
      checkTables: async function() {
        if (!this.client && !this.init()) return false;
        try {
          // Try to check pos_vendors first (simpler table)
          var v = await this.client.from('pos_vendors').select('id').limit(1);
          if (v.error) {
            console.error('[POS] pos_vendors check failed:', v.error);
            this.tablesExist = false;
            this.error = 'POS tables not found. Run pos_standalone_schema.sql in Supabase SQL Editor.';
            return false;
          }
          
          // Then check products
          var p = await this.client.from('pos_products').select('id').limit(1);
          if (p.error) {
            console.error('[POS] pos_products check failed:', p.error);
            this.tablesExist = false;
            this.error = 'pos_products table error: ' + p.error.message;
            return false;
          }
          
          this.tablesExist = true;
          this.error = null;
          console.log('[POS] Tables verified OK');
          return true;
        } catch(e) { 
          console.error('[POS] checkTables exception:', e);
          this.tablesExist = false; 
          this.error = e.message; 
          return false; 
        }
      },
      
      // Ensure default categories exist
      ensureCategories: async function() {
        if (!this.client) return false;
        var cats = [
          { id: 'vegetables', name: 'Vegetables', sort_order: 1, icon: '🥬' },
          { id: 'fruit', name: 'Fruit', sort_order: 2, icon: '🍎' },
          { id: 'eggs', name: 'Eggs', sort_order: 3, icon: '🥚' },
          { id: 'dairy', name: 'Dairy', sort_order: 4, icon: '🧀' },
          { id: 'meat', name: 'Meat', sort_order: 5, icon: '🥩' },
          { id: 'preserves', name: 'Preserves', sort_order: 6, icon: '🍯' }
        ];
        for (var i = 0; i < cats.length; i++) {
          await this.client.from('pos_categories').upsert(cats[i], { onConflict: 'id' });
        }
        console.log('[POS] Categories ensured');
        return true;
      },
      
      fetchProducts: async function() {
        if (!this.client) return null;
        try {
          var r = await this.client.from('pos_products').select('*').eq('is_active', true);
          if (r.error) { console.error('[POS] fetchProducts error:', r.error); return null; }
          return r.data;
        } catch(e) { console.error('[POS] fetchProducts exception:', e); return null; }
      },
      
      fetchVendors: async function() {
        if (!this.client) return null;
        try {
          var r = await this.client.from('pos_vendors').select('*').eq('is_active', true);
          if (r.error) { console.error('[POS] fetchVendors error:', r.error); return null; }
          return r.data;
        } catch(e) { console.error('[POS] fetchVendors exception:', e); return null; }
      },
      
      fetchSettings: async function() {
        if (!this.client) return null;
        try {
          // Settings are stored as key/value pairs with JSONB values
          var r = await this.client.from('pos_settings').select('*');
          if (r.error) { console.error('[POS] fetchSettings error:', r.error); return null; }
          // Convert key/value rows to single object
          var settings = {};
          if (r.data) {
            r.data.forEach(function(row) {
              settings[row.key] = row.value;
            });
          }
          console.log('[POS] Fetched settings:', Object.keys(settings));
          return settings;
        } catch(e) { console.error('[POS] fetchSettings exception:', e); return null; }
      },
      
      fetchTransactions: async function() {
        if (!this.client) return [];
        try {
          // Fetch transactions with their items
          var txR = await this.client.from('pos_transactions').select('*').order('created_at', { ascending: false }).limit(100);
          if (txR.error) { console.error('[POS] fetchTransactions error:', txR.error); return []; }
          
          var transactions = [];
          for (var i = 0; i < (txR.data || []).length; i++) {
            var tx = txR.data[i];
            // Fetch items for this transaction
            var itemsR = await this.client.from('pos_transaction_items').select('*').eq('transaction_id', tx.id);
            var items = (itemsR.data || []).map(function(item) {
              return {
                productId: item.product_id,
                vendorId: item.vendor_id,
                quantity: parseFloat(item.quantity),
                price: parseFloat(item.unit_price),
                total: parseFloat(item.line_total),
                commissionRate: parseFloat(item.commission_rate),
                commissionAmt: parseFloat(item.commission_amt)
              };
            });
            transactions.push({
              id: tx.id,
              transactionNum: tx.transaction_num,
              date: tx.created_at,
              items: items,
              subtotal: parseFloat(tx.subtotal),
              tax: parseFloat(tx.tax_amount),
              total: parseFloat(tx.total),
              paymentMethod: tx.payment_method,
              cashier: tx.cashier_id,
              status: tx.status
            });
          }
          console.log('[POS] Fetched transactions:', transactions.length);
          return transactions;
        } catch(e) { console.error('[POS] fetchTransactions exception:', e); return []; }
      },
      
      saveSettings: async function(s) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          // Settings are stored as key/value pairs with JSONB values
          var rows = [
            { key: 'store', value: { name: s.storeName, address: s.storeAddress, phone: s.storePhone, email: s.storeEmail } },
            { key: 'receipt', value: { header: s.receiptHeader, footer: s.receiptFooter } },
            { key: 'kiosk', value: { enabled: s.kioskEnabled, timeout: s.kioskTimeout } },
            { key: 'payment', value: { processor: s.paymentProcessor, testMode: s.paymentTestMode } }
          ];
          
          for (var i = 0; i < rows.length; i++) {
            var r = await this.client.from('pos_settings').upsert(rows[i], { onConflict: 'key' });
            if (r.error) { console.error('[POS] saveSettings error for', rows[i].key, ':', r.error); }
          }
          console.log('[POS] Settings saved');
          return { success: true };
        } catch(e) { console.error('[POS] saveSettings exception:', e); return { success: false, error: e.message }; }
      },
      
      saveTransaction: async function(tx, items) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var txR = await this.client.from('pos_transactions').insert(tx).select().single();
          if (txR.error) { console.error('[POS] saveTransaction error:', txR.error); throw txR.error; }
          var itemsData = items.map(function(i) { 
            var copy = {}; for (var k in i) copy[k] = i[k];
            copy.transaction_id = txR.data.id;
            return copy;
          });
          var itemsR = await this.client.from('pos_transaction_items').insert(itemsData);
          if (itemsR.error) { console.error('[POS] saveTransactionItems error:', itemsR.error); throw itemsR.error; }
          console.log('[POS] Transaction saved:', txR.data.id);
          return { success: true, data: txR.data };
        } catch(e) { console.error('[POS] saveTransaction exception:', e); return { success: false, error: e.message }; }
      },
      
      saveProduct: async function(p) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          console.log('[POS] saveProduct called with:', p);
          
          // Ensure vendor exists first
          var vendorCheck = await this.client.from('pos_vendors').select('id').eq('id', p.vendorId).single();
          if (vendorCheck.error) {
            console.log('[POS] Vendor not found:', p.vendorId, '- creating it');
            var vendorCreate = await this.client.from('pos_vendors').upsert({
              id: p.vendorId,
              name: p.vendorId.replace(/-/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); }),
              vendor_type: 'consignment',
              commission_rate: 15,
              is_active: true
            }, { onConflict: 'id' });
            if (vendorCreate.error) {
              console.error('[POS] Failed to create vendor:', vendorCreate.error);
              return { success: false, error: 'Failed to create vendor: ' + vendorCreate.error.message };
            }
          }
          
          // Ensure category exists
          var catCheck = await this.client.from('pos_categories').select('id').eq('id', p.category || 'vegetables').single();
          if (catCheck.error) {
            console.log('[POS] Category not found:', p.category, '- creating it');
            var catCreate = await this.client.from('pos_categories').upsert({
              id: p.category || 'vegetables',
              name: (p.category || 'vegetables').charAt(0).toUpperCase() + (p.category || 'vegetables').slice(1),
              sort_order: 99,
              icon: '📦',
              is_active: true
            }, { onConflict: 'id' });
            if (catCreate.error) {
              console.error('[POS] Failed to create category:', catCreate.error);
            }
          }
          
          var d = {
            id: p.id || 'p_' + Date.now(),
            name: p.name, 
            price: parseFloat(p.price), 
            unit: p.unit || 'each',
            unit_type: p.unitType || 'each', 
            stock: parseInt(p.stock) || 0,
            min_stock: parseInt(p.minStock) || 5, 
            barcode: p.barcode || null,
            image_url: p.image || null, 
            vendor_id: p.vendorId,
            category_id: p.category || 'vegetables', 
            is_active: true
          };
          
          console.log('[POS] Upserting product:', d);
          var r = await this.client.from('pos_products').upsert(d, { onConflict: 'id' }).select().single();
          if (r.error) { 
            console.error('[POS] saveProduct error:', r.error); 
            return { success: false, error: r.error.message + ' (code: ' + r.error.code + ')' }; 
          }
          console.log('[POS] Product saved successfully:', r.data);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveProduct exception:', e); return { success: false, error: e.message }; }
      },
      
      saveVendor: async function(v) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var d = {
            id: v.id || v.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, ''),
            name: v.name, 
            vendor_type: v.type || 'consignment',
            commission_rate: parseFloat(v.commissionRate) || 0,
            contact_email: v.contact || null,
            payment_method: v.paymentMethod || 'check',
            payment_terms: v.paymentTerms || 'net-15',
            color: v.color || '#666666', 
            is_active: v.active !== false
          };
          var r = await this.client.from('pos_vendors').upsert(d, { onConflict: 'id' }).select().single();
          if (r.error) { console.error('[POS] saveVendor error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Vendor saved:', d.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveVendor exception:', e); return { success: false, error: e.message }; }
      },
      
      deleteProduct: async function(id) {
        if (!this.client) return false;
        try {
          var r = await this.client.from('pos_products').update({ is_active: false }).eq('id', id);
          if (r.error) { console.error('[POS] deleteProduct error:', r.error); return false; }
          console.log('[POS] Product deleted:', id);
          return true;
        } catch(e) { console.error('[POS] deleteProduct exception:', e); return false; }
      },
      
      deleteVendor: async function(id) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          // Check if vendor has any products
          var prodCheck = await this.client.from('pos_products').select('id').eq('vendor_id', id).eq('is_active', true).limit(1);
          if (prodCheck.data && prodCheck.data.length > 0) {
            return { success: false, error: 'Cannot delete vendor with active products. Delete or reassign products first.' };
          }
          // Check if vendor has any transactions
          var txCheck = await this.client.from('pos_transaction_items').select('id').eq('vendor_id', id).limit(1);
          if (txCheck.data && txCheck.data.length > 0) {
            // Soft delete - has transaction history
            var r = await this.client.from('pos_vendors').update({ is_active: false }).eq('id', id);
            if (r.error) { console.error('[POS] deleteVendor error:', r.error); return { success: false, error: r.error.message }; }
            console.log('[POS] Vendor soft deleted (has transactions):', id);
            return { success: true, softDelete: true };
          }
          // Hard delete - no transaction history
          var r = await this.client.from('pos_vendors').delete().eq('id', id);
          if (r.error) { console.error('[POS] deleteVendor error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Vendor hard deleted:', id);
          return { success: true };
        } catch(e) { console.error('[POS] deleteVendor exception:', e); return { success: false, error: e.message }; }
      },
      
      // Mark settlement as paid
      markSettlementPaid: async function(vendorId, periodStart, periodEnd, grossSales, commission, netPayable) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var settlement = {
            vendor_id: vendorId,
            period_start: periodStart,
            period_end: periodEnd,
            gross_sales: grossSales,
            commission: commission,
            net_payable: netPayable,
            status: 'paid',
            paid_at: new Date().toISOString()
          };
          var r = await this.client.from('pos_settlements').insert(settlement).select().single();
          if (r.error) { console.error('[POS] markSettlementPaid error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Settlement marked paid:', r.data.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] markSettlementPaid exception:', e); return { success: false, error: e.message }; }
      },
      
      // User management
      fetchUsers: async function() {
        if (!this.client) return [];
        try {
          var r = await this.client.from('pos_users').select('*').order('created_at', { ascending: true });
          if (r.error) { 
            if (r.error.code === '42P01') { // Table doesn't exist
              console.log('[POS] pos_users table not found, using defaults');
              return null; 
            }
            console.error('[POS] fetchUsers error:', r.error); 
            return null; 
          }
          console.log('[POS] Fetched users:', r.data?.length || 0);
          return r.data || [];
        } catch(e) { console.error('[POS] fetchUsers exception:', e); return null; }
      },
      
      saveUser: async function(u) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var d = {
            id: u.id,
            username: u.username,
            pin: u.pin,
            name: u.name,
            email: u.email || null,
            role: u.role,
            permissions: u.permissions || [],
            is_active: u.active !== false
          };
          var r = await this.client.from('pos_users').upsert(d, { onConflict: 'id' }).select().single();
          if (r.error) { console.error('[POS] saveUser error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] User saved:', d.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveUser exception:', e); return { success: false, error: e.message }; }
      },
      
      deleteUser: async function(id) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var r = await this.client.from('pos_users').delete().eq('id', id);
          if (r.error) { console.error('[POS] deleteUser error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] User deleted:', id);
          return { success: true };
        } catch(e) { console.error('[POS] deleteUser exception:', e); return { success: false, error: e.message }; }
      },
      
      // Device management
      fetchDevices: async function() {
        if (!this.client) return [];
        try {
          var r = await this.client.from('pos_devices').select('*').order('created_at', { ascending: true });
          if (r.error) { 
            console.error('[POS] fetchDevices error:', r.error); 
            return null; 
          }
          console.log('[POS] Fetched devices:', r.data?.length || 0);
          return r.data || [];
        } catch(e) { console.error('[POS] fetchDevices exception:', e); return null; }
      },
      
      saveDevice: async function(d) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var data = {
            id: d.id,
            name: d.name,
            device_type: d.type,
            model: d.model || null,
            connection: d.connection || 'usb',
            port: d.port || null,
            status: d.status || 'disconnected',
            is_enabled: d.enabled !== false,
            config: d.config || {}
          };
          var r = await this.client.from('pos_devices').upsert(data, { onConflict: 'id' }).select().single();
          if (r.error) { console.error('[POS] saveDevice error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Device saved:', d.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveDevice exception:', e); return { success: false, error: e.message }; }
      },
      
      deleteDevice: async function(id) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var r = await this.client.from('pos_devices').delete().eq('id', id);
          if (r.error) { console.error('[POS] deleteDevice error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Device deleted:', id);
          return { success: true };
        } catch(e) { console.error('[POS] deleteDevice exception:', e); return { success: false, error: e.message }; }
      },
      
      // Export functions
      exportToCSV: function(data, filename) {
        if (!data || data.length === 0) { alert('No data to export'); return; }
        var headers = Object.keys(data[0]);
        var csv = headers.join(',') + '\n';
        data.forEach(function(row) {
          csv += headers.map(function(h) {
            var val = row[h];
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') val = JSON.stringify(val);
            val = String(val).replace(/"/g, '""');
            if (val.includes(',') || val.includes('"') || val.includes('\n')) val = '"' + val + '"';
            return val;
          }).join(',') + '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename + '_' + new Date().toISOString().split('T')[0] + '.csv';
        link.click();
      },
      
      exportDatabaseBackup: async function() {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var backup = { 
            exportDate: new Date().toISOString(),
            version: '7.7',
            tables: {}
          };
          
          // Export all tables
          var tables = ['pos_vendors', 'pos_categories', 'pos_products', 'pos_transactions', 'pos_transaction_items', 'pos_settlements', 'pos_settings', 'pos_users', 'pos_devices'];
          for (var i = 0; i < tables.length; i++) {
            var r = await this.client.from(tables[i]).select('*');
            backup.tables[tables[i]] = r.data || [];
            console.log('[POS] Exported', tables[i], ':', (r.data || []).length, 'rows');
          }
          
          // Download as JSON
          var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          var link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'pos_backup_' + new Date().toISOString().split('T')[0] + '.json';
          link.click();
          
          return { success: true, tables: Object.keys(backup.tables).length };
        } catch(e) { 
          console.error('[POS] exportDatabaseBackup error:', e); 
          return { success: false, error: e.message }; 
        }
      },
      
      // Seed demo data to Supabase
      seedDemoData: async function() {
        if (!this.client) return { success: false, error: 'Not connected' };
        console.log('[POS] Seeding demo data...');
        
        try {
          // Demo vendors
          var vendors = [
            { id: 'tuckaway-farm', name: 'Tuckaway Farm', vendor_type: 'owner', commission_rate: 0, color: '#16a34a', contact_email: 'farm@tuckaway.com', is_active: true },
            { id: 'sunshine-eggs', name: 'Sunshine Eggs', vendor_type: 'consignment', commission_rate: 15, color: '#eab308', contact_email: 'eggs@sunshine.com', is_active: true },
            { id: 'valley-dairy', name: 'Valley Dairy', vendor_type: 'consignment', commission_rate: 12, color: '#3b82f6', contact_email: 'info@valleydairy.com', is_active: true },
            { id: 'wildwood-preserves', name: 'Wildwood Preserves', vendor_type: 'consignment', commission_rate: 20, color: '#dc2626', contact_email: 'jams@wildwood.com', is_active: true },
            { id: 'green-meadow-meats', name: 'Green Meadow Meats', vendor_type: 'consignment', commission_rate: 18, color: '#7c3aed', contact_email: 'orders@greenmeadow.com', is_active: true }
          ];
          
          for (var i = 0; i < vendors.length; i++) {
            await this.client.from('pos_vendors').upsert(vendors[i], { onConflict: 'id' });
          }
          console.log('[POS] Vendors seeded:', vendors.length);

; }; reader.readAsDataURL(file); } }} /></label></div>{form.image && <div style={{ marginTop: '8px', textAlign: 'center' }}><img src={form.image} alt="Preview" style={{ maxWidth: '120px', maxHeight: '80px', borderRadius: '8px', objectFit: 'cover', border: '1px solid #ddd' }} onError={e => e.target.style.display = 'none'} /><button type="button" style={{ display: 'block', margin: '4px auto 0', fontSize: '10px', color: '#dc2626', background: 'none', border: 'none', cursor: 'pointer' }} onClick={() => setForm({ ...form, image: '' })}>✕ Remove</button></div>}</div>

            {adminSection === 'database' && (<div style={styles.card}><h3 style={{ margin: '0 0 16px', fontSize: '15px' }}>🗄️ Database Configuration</h3><div style={{ display: 'grid', gap: '12px' }}><div style={{ padding: '12px', borderRadius: '8px', background: dbStatus.connected && dbStatus.tablesExist ? '#dcfce7' : dbStatus.connected ? '#fef3c7' : '#fef2f2', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: '600', color: dbStatus.connected && dbStatus.tablesExist ? '#166534' : dbStatus.connected ? '#92400e' : '#b91c1c' }}>{dbStatus.connected && dbStatus.tablesExist ? '✓ Connected to Supabase' : dbStatus.connected ? '⚠️ Connected but tables missing' : '✗ Not connected'}</div><div style={{ fontSize: '10px', color: '#666' }}>{dbStatus.error || 'Using shared credentials from localStorage'}</div></div><button style={{ ...styles.button, ...(dbStatus.connected ? styles.secondaryBtn : styles.primaryBtn) }} onClick={testDbConnection} disabled={testingDb}>{testingDb ? 'Testing...' : 'Test Connection'}</button></div>{dbStatus.connected && dbStatus.tablesExist && (<><div style={{ padding: '12px', borderRadius: '8px', background: '#f0f9ff', border: '1px solid #bae6fd' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: '600', color: '#0369a1' }}>🌱 Seed Demo Data</div><div style={{ fontSize: '11px', color: '#666' }}>Populate database with sample vendors and products</div></div><button style={{ ...styles.button, ...styles.primaryBtn }} onClick={async () => { const btn = event.target; btn.disabled = true; btn.textContent = 'Seeding...'; const result = await window.SUPABASE_POS.seedDemoData(); if (result.success) { alert('Demo data seeded! ' + result.vendors + ' vendors, ' + result.products + ' products. Refresh to see changes.'); location.reload(); } else { alert('Error: ' + result.error); btn.disabled = false; btn.textContent = '🌱 Seed Data'; } }}>🌱 Seed Data</button></div></div><div style={{ padding: '12px', borderRadius: '8px', background: '#faf5ff', border: '1px solid #e9d5ff' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: '600', color: '#7c3aed' }}>🔗 Share Access Link</div><div style={{ fontSize: '11px', color: '#666' }}>Generate a link for other devices/users</div></div><button style={{ ...styles.button, background: '#7c3aed', color: 'white' }} onClick={() => { const creds = JSON.parse(localStorage.getItem('farmhack-supabase-v1') || '{}'); if (creds.url && creds.anonKey) { const shareUrl = window.location.origin + window.location.pathname + '?sb_url=' + encodeURIComponent(creds.url) + '&sb_key=' + encodeURIComponent(creds.anonKey); navigator.clipboard.writeText(shareUrl).then(() => alert('Share link copied to clipboard!\n\nAnyone with this link will auto-connect to your Supabase database.')).catch(() => { prompt('Copy this link:', shareUrl); }); } else { alert('No Supabase credentials found. Configure in Admin Panel first.'); } }}>📋 Copy Link</button></div></div><div style={{ padding: '12px', borderRadius: '8px', background: '#fefce8', border: '1px solid #fef08a' }}><div style={{ fontWeight: '600', color: '#a16207', marginBottom: '8px' }}>📤 Export Data as CSV</div><div style={{ display: 'flex', flexWrap: 'wrap', gap: '6px' }}><button style={{ ...styles.button, ...styles.secondaryBtn, fontSize: '10px', padding: '6px 10px' }} onClick={() => { const data = Object.values(products).flat().map(p => ({ id: p.id, name: p.name, price: p.price, unit: p.unit, unitType: p.unitType, stock: p.stock, barcode: p.barcode, vendorId: p.vendorId, category: p.category })); window.SUPABASE_POS.exportToCSV(data, 'products'); }}>📦 Products</button><button style={{ ...styles.button, ...styles.secondaryBtn, fontSize: '10px', padding: '6px 10px' }} onClick={() => { const data = Object.values(vendors).map(v => ({ id: v.id, name: v.name, type: v.type, commissionRate: v.commissionRate, contact: v.contact, paymentMethod: v.paymentMethod, paymentTerms: v.paymentTerms, active: v.active })); window.SUPABASE_POS.exportToCSV(data, 'vendors'); }}>🤝 Vendors</button><button style={{ ...styles.button, ...styles.secondaryBtn, fontSize: '10px', padding: '6px 10px' }} onClick={() => { const data = transactions.map(t => ({ id: t.id, date: t.date, total: t.total, paymentMethod: t.paymentMethod, itemCount: t.items?.length || 0, cashier: t.cashier })); window.SUPABASE_POS.exportToCSV(data, 'transactions'); }}>🧾 Transactions</button><button style={{ ...styles.button, ...styles.secondaryBtn, fontSize: '10px', padding: '6px 10px' }} onClick={() => { const data = users.map(u => ({ id: u.id, username: u.username, name: u.name, email: u.email, role: u.role, active: u.active })); window.SUPABASE_POS.exportToCSV(data, 'users'); }}>👥 Users</button></div></div><div style={{ padding: '12px', borderRadius: '8px', background: '#ecfdf5', border: '1px solid #a7f3d0' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: '600', color: '#047857' }}>💾 Full Database Backup</div><div style={{ fontSize: '11px', color: '#666' }}>Download complete database as JSON file</div></div><button style={{ ...styles.button, background: '#047857', color: 'white' }} onClick={async () => { const btn = event.target; btn.disabled = true; btn.textContent = 'Exporting...'; const result = await window.SUPABASE_POS.exportDatabaseBackup(); if (result.success) { alert('Backup complete! Downloaded ' + result.tables + ' tables.'); } else { alert('Error: ' + result.error); } btn.disabled = false; btn.textContent = '💾 Backup'; }}>💾 Backup</button></div></div></>)}<div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>Database Type</label><select style={styles.input} value={localSettings.dbType} onChange={e => setLocalSettings({ ...localSettings, dbType: e.target.value })}><option value="supabase">Supabase (Cloud)</option><option value="postgresql">PostgreSQL (Local)</option><option value="sqlite">SQLite (Local)</option></select></div><div style={{ background: '#f0f9ff', padding: '12px', borderRadius: '8px', fontSize: '11px', color: '#0369a1' }}><strong>💡 Tip:</strong> Supabase credentials are shared across all FarmHack apps. Configure them in the Admin Panel.</div><button style={{ ...styles.button, ...styles.primaryBtn }} onClick={saveAdminSettings} disabled={adminSaving}>{adminSaving ? 'Saving...' : '💾 Save Database Settings'}</button></div></div>)}

            {adminSection === 'farmos' && (<div style={styles.card}><h3 style={{ margin: '0 0 16px', fontSize: '15px' }}>🌱 farmOS Integration</h3><div style={{ display: 'grid', gap: '12px' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px', background: '#f8f7f4', borderRadius: '8px' }}><div><span style={{ fontWeight: '600' }}>Enable farmOS Sync</span><div style={{ fontSize: '11px', color: '#666' }}>Sync harvests, sales, and inventory</div></div><button style={{ ...styles.toggle, background: localSettings.farmosEnabled ? '#0f6e56' : '#ccc' }} onClick={() => setLocalSettings({ ...localSettings, farmosEnabled: !localSettings.farmosEnabled })}><div style={{ ...styles.toggleKnob, left: localSettings.farmosEnabled ? '23px' : '3px' }} /></button></div>{localSettings.farmosEnabled && (<><div style={{ padding: '12px', borderRadius: '8px', background: localSettings.farmosStatus === 'connected' ? '#dcfce7' : '#fef3c7', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: '600', color: localSettings.farmosStatus === 'connected' ? '#166534' : '#92400e' }}>{localSettings.farmosStatus === 'connected' ? '✓ Connected' : '○ Not connected'}</div>{localSettings.farmosLastSync && <div style={{ fontSize: '10px', color: '#666' }}>Last sync: {new Date(localSettings.farmosLastSync).toLocaleString()}</div>}</div><button style={{ ...styles.button, ...styles.secondaryBtn }} onClick={testFarmosConnection} disabled={testingFarmos}>{testingFarmos ? 'Testing...' : 'Test Connection'}</button></div><div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>farmOS Server URL</label><input style={styles.input} value={localSettings.farmosUrl} onChange={e => setLocalSettings({ ...localSettings, farmosUrl: e.target.value })} placeholder="https://your-farm.farmos.net" /></div><div style={{ background: '#f8f7f4', padding: '12px', borderRadius: '8px' }}><div style={{ fontSize: '12px', fontWeight: '600', marginBottom: '10px' }}>OAuth 2.0 Credentials</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '10px', color: '#666' }}>Client ID</label><input style={{ ...styles.input, padding: '8px' }} value={localSettings.farmosClientId} onChange={e => setLocalSettings({ ...localSettings, farmosClientId: e.target.value })} /></div><div><label style={{ fontSize: '10px', color: '#666' }}>Client Secret</label><input style={{ ...styles.input, padding: '8px' }} type="password" value={localSettings.farmosClientSecret} onChange={e => setLocalSettings({ ...localSettings, farmosClientSecret: e.target.value })} /></div></div></div><div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}><label style={{ fontSize: '12px' }}>Sync Interval:</label><select style={{ ...styles.input, width: '150px' }} value={localSettings.farmosSyncInterval} onChange={e => setLocalSettings({ ...localSettings, farmosSyncInterval: parseInt(e.target.value) })}><option value={5}>Every 5 minutes</option><option value={15}>Every 15 minutes</option><option value={30}>Every 30 minutes</option><option value={60}>Every hour</option></select></div><div style={{ background: '#f0fdf4', padding: '12px', borderRadius: '8px' }}><div style={{ fontSize: '12px', fontWeight: '600', marginBottom: '8px', color: '#0f6e56' }}>Sync Options</div><div style={{ display: 'grid', gap: '6px' }}><label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}><input type="checkbox" checked={localSettings.farmosSyncHarvests} onChange={e => setLocalSettings({ ...localSettings, farmosSyncHarvests: e.target.checked })} /> Harvest logs → Inventory</label><label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}><input type="checkbox" checked={localSettings.farmosSyncSales} onChange={e => setLocalSettings({ ...localSettings, farmosSyncSales: e.target.checked })} /> Sales → farmOS observations</label><label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}><input type="checkbox" checked={localSettings.farmosSyncInventory} onChange={e => setLocalSettings({ ...localSettings, farmosSyncInventory: e.target.checked })} /> Import farmOS assets as products</label></div></div></>)}<button style={{ ...styles.button, ...styles.primaryBtn }} onClick={saveAdminSettings} disabled={adminSaving}>{adminSaving ? 'Saving...' : '💾 Save farmOS Settings'}</button></div></div>)}
          </div>
        );
      };

      // SETTLEMENT MODAL
      const SettlementModal = () => {
        const [processing, setProcessing] = useState(null);
        const [paidVendors, setPaidVendors] = useState({});
        
        // Calculate settlements from transactions state (loaded from Supabase)
        const vendorTotals = {};
        transactions.forEach(tx => {
          (tx.items || []).forEach(item => {
            if (!vendorTotals[item.vendorId]) {
              vendorTotals[item.vendorId] = { gross: 0, items: 0, commission: 0 };
            }
            vendorTotals[item.vendorId].gross += item.total || 0;
            vendorTotals[item.vendorId].items += 1;
            vendorTotals[item.vendorId].commission += item.commissionAmt || 0;
          });
        });
        
        const handleMarkPaid = async (vendor, totals, commission, netPayable) => {
          if (!confirm(`Mark ${vendor.name} as paid?\n\nGross: $${totals.gross.toFixed(2)}\nCommission: -$${commission.toFixed(2)}\nNet Payable: $${netPayable.toFixed(2)}`)) return;
          
          setProcessing(vendor.id);
          const today = new Date().toISOString().split('T')[0];
          const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
          
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.markSettlementPaid(
              vendor.id, thirtyDaysAgo, today, totals.gross, commission, netPayable
            );
            if (!result.success) {
              alert('Error: ' + result.error);
              setProcessing(null);
              return;
            }
          }
          
          setPaidVendors(prev => ({ ...prev, [vendor.id]: { date: today, amount: netPayable } }));
          setProcessing(null);
          alert(`Settlement recorded!\n\nPaid $${netPayable.toFixed(2)} to ${vendor.name}`);
        };
        
        return (
          <div style={styles.modal} onClick={() => setShowSettlement(false)}>
            <div style={{ ...styles.modalContent, maxWidth: '700px' }} onClick={e => e.stopPropagation()}>
              <h2 style={{ margin: '0 0 16px', fontSize: '18px' }}>💰 Vendor Settlement Report</h2>
              <div style={{ fontSize: '11px', color: '#666', marginBottom: '12px' }}>Based on {transactions.length} transaction(s) from Supabase</div>
              <div style={{ display: 'grid', gap: '10px' }}>
                {Object.values(vendors).filter(v => v.type === 'consignment').map(vendor => {
                  const totals = vendorTotals[vendor.id] || { gross: 0, items: 0, commission: 0 };
                  const commission = totals.commission > 0 ? totals.commission : totals.gross * (vendor.commissionRate / 100);
                  const netPayable = totals.gross - commission;
                  const isPaid = paidVendors[vendor.id];
                  
                  return (
                    <div key={vendor.id} style={{ padding: '14px', borderRadius: '10px', border: `2px solid ${isPaid ? '#22c55e' : vendor.color}`, background: isPaid ? '#f0fdf4' : totals.gross > 0 ? '#fafafa' : 'white' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <span style={{ width: '10px', height: '10px', borderRadius: '50%', background: vendor.color }} />
                          <span style={{ fontWeight: '600' }}>{vendor.name}</span>
                          <span style={{ fontSize: '10px', color: '#888' }}>{vendor.commissionRate}% commission</span>
                          {isPaid && <span style={{ fontSize: '10px', padding: '2px 6px', background: '#22c55e', color: 'white', borderRadius: '4px' }}>✓ Paid</span>}
                        </div>
                        {totals.gross > 0 && !isPaid && (
                          <button 
                            style={{ ...styles.button, ...styles.primaryBtn, padding: '4px 10px', fontSize: '10px' }}
                            onClick={() => handleMarkPaid(vendor, totals, commission, netPayable)}
                            disabled={processing === vendor.id}
                          >
                            {processing === vendor.id ? 'Processing...' : 'Mark Paid'}
                          </button>
                        )}
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', marginTop: '10px', fontSize: '11px' }}>
                        <div><div style={{ color: '#888' }}>Items Sold</div><div style={{ fontWeight: '600' }}>{totals.items}</div></div>
                        <div><div style={{ color: '#888' }}>Gross Sales</div><div style={{ fontWeight: '600' }}>${totals.gross.toFixed(2)}</div></div>
                        <div><div style={{ color: '#888' }}>Commission</div><div style={{ fontWeight: '600', color: '#dc2626' }}>-${commission.toFixed(2)}</div></div>
                        <div><div style={{ color: '#888' }}>Net Payable</div><div style={{ fontWeight: '700', color: isPaid ? '#22c55e' : '#0f6e56' }}>${netPayable.toFixed(2)}</div></div>
                      </div>
                    </div>
                  );
                })}
                {Object.values(vendors).filter(v => v.type === 'consignment').length === 0 && (
                  <div style={{ padding: '20px', textAlign: 'center', color: '#888' }}>No consignment vendors found</div>
                )}
              </div>
              <button style={{ ...styles.button, ...styles.secondaryBtn, width: '100%', marginTop: '16px' }} onClick={() => setShowSettlement(false)}>Close</button>
            </div>
          </div>
        );
      };

      // MAIN RENDER
      const dbClass = dbStatus.connected && dbStatus.tablesExist ? 'connected' : dbStatus.connected ? 'partial' : 'demo';
      const dbText = dbStatus.loading ? '⏳' : dbStatus.connected && dbStatus.tablesExist ? '🟢 Supabase' : dbStatus.connected ? '🟡 No Tables' : '🟠 Demo';
      
      return (
        <div style={styles.app}>
          <div className={`db-status ${dbClass}`} title={dbStatus.error || (dbStatus.connected ? 'Connected' : 'Demo mode')}>{dbText}</div>
          <header style={styles.header}><div style={styles.logo}><span style={{ fontSize: '22px' }}>🌱</span><div><div>{settings.storeName.split(' ').slice(0, 3).join(' ')}</div><div style={{ fontSize: '9px', opacity: 0.8, fontWeight: '400' }}>{user.role.charAt(0).toUpperCase() + user.role.slice(1)}: {user.name}</div></div></div><div style={styles.tabs}>{availableViews.map(tab => (<button key={tab.id} style={{ ...styles.tab, ...(view === tab.id ? styles.tabActive : styles.tabInactive) }} onClick={() => setView(tab.id)}>{tab.label}</button>))}</div><button style={{ ...styles.button, background: 'rgba(255,255,255,0.15)', color: 'white', fontSize: '11px' }} onClick={logout}>Logout</button></header>
          {view === 'pos' && renderPOS()}
          {view === 'kiosk' && renderKiosk()}
          {view === 'vendors' && renderVendors()}
          {view === 'inventory' && renderInventory()}
          {view === 'admin' && renderAdmin()}
          {editingProduct !== null && <ProductEditModal product={editingProduct.id ? editingProduct : null} onClose={() => setEditingProduct(null)} />}
          {editingVendor !== null && <VendorEditModal vendor={editingVendor.id ? editingVendor : null} onClose={() => setEditingVendor(null)} />}
          {editingUser !== null && <UserEditModal userToEdit={editingUser.id ? editingUser : null} onClose={() => setEditingUser(null)} />}
          {editingDevice !== null && <DeviceEditModal deviceToEdit={editingDevice.id ? editingDevice : null} onClose={() => setEditingDevice(null)} />}
          {showPayment && <PaymentModal />}
          {showSettlement && <SettlementModal />}
        </div>
      );
    }

    // APP ROOT
    function App() { return <AuthProvider><AppContent /></AuthProvider>; }
    function AppContent() { const { user, loading } = useAuth(); if (loading) return <div className="loading">Loading...</div>; return user ? <MainApp /> : <LoginScreen />; }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
