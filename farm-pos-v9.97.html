                    {!bt.service_active && (
                      <div style={{ padding: '8px 12px', borderRadius: '8px', background: '#fef2f2', fontSize: '11px', color: '#b91c1c', marginBottom: '10px' }}>
                        Bluetooth service inactive — run: <code style={{ background: '#fee2e2', padding: '2px 5px', borderRadius: '4px' }}>sudo systemctl start bluetooth</code>
                      </div>
                    )}

                    <div style={{ padding: '8px 12px', borderRadius: '8px', background: btOn ? '#eff6ff' : '#f1f5f9', fontSize: '11px', color: btOn ? '#1d4ed8' : '#64748b' }}>
                      {btOn
                        ? ('✓ Discoverable as "' + bt.name + '"  ·  ' + bt.address + '  ·  ' + bt.paired_count + ' paired device(s)')
                        : '○ Not discoverable'}
                    </div>

                    {btOn && (
                      <div style={{ marginTop: '10px', padding: '10px 12px', background: '#dbeafe', borderRadius: '8px', fontSize: '11px', color: '#1e40af', lineHeight: '1.6' }}>
                        <strong>To connect a phone:</strong> Open Bluetooth settings on the phone → pair with <strong>{bt.name}</strong> → enable "Internet via Bluetooth" or "Bluetooth network" to access the Pi at <strong>{wf.ip}:8080</strong>
                      </div>
                    )}
                  </div>

                  {/* Refresh button */}
                  <button
                    style={{ ...styles.button, ...styles.secondaryBtn, marginTop: '12px', fontSize: '11px' }}
                    onClick={refreshNetworkStatus}
                  >↺ Refresh Status</button>
                </div>
              );
            })()}

            {adminSection === 'farmos' && (<div style={styles.card}><h3 style={{ margin: '0 0 16px', fontSize: '15px' }}>🌱 farmOS Integration</h3><div style={{ display: 'grid', gap: '12px' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px', background: '#f8f7f4', borderRadius: '8px' }}><div><span style={{ fontWeight: '600' }}>Enable farmOS Sync</span><div style={{ fontSize: '11px', color: '#666' }}>Sync harvests, sales, and inventory</div></div><button style={{ ...styles.toggle, background: localSettings.farmosEnabled ? '#0f6e56' : '#ccc' }} onClick={() => setLocalSettings({ ...localSettings, farmosEnabled: !localSettings.farmosEnabled })}><div style={{ ...styles.toggleKnob, left: localSettings.farmosEnabled ? '23px' : '3px' }} /></button></div>{localSettings.farmosEnabled && (<><div style={{ padding: '12px', borderRadius: '8px', background: localSettings.farmosStatus === 'connected' ? '#dcfce7' : '#fef3c7', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}><div><div style={{ fontWeight: '600', color: localSettings.farmosStatus === 'connected' ? '#166534' : '#92400e' }}>{localSettings.farmosStatus === 'connected' ? '✓ Connected' : '○ Not connected'}</div>{localSettings.farmosLastSync && <div style={{ fontSize: '10px', color: '#666' }}>Last sync: {new Date(localSettings.farmosLastSync).toLocaleString()}</div>}</div><button style={{ ...styles.button, ...styles.secondaryBtn }} onClick={testFarmosConnection} disabled={testingFarmos}>{testingFarmos ? 'Testing...' : 'Test Connection'}</button></div><div><label style={{ fontSize: '11px', color: '#666', display: 'block', marginBottom: '4px' }}>farmOS Server URL</label><input style={styles.input} value={localSettings.farmosUrl} onChange={e => setLocalSettings({ ...localSettings, farmosUrl: e.target.value })} placeholder="https://your-farm.farmos.net" /></div><div style={{ background: '#f8f7f4', padding: '12px', borderRadius: '8px' }}><div style={{ fontSize: '12px', fontWeight: '600', marginBottom: '10px' }}>OAuth 2.0 Credentials</div><div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '10px', color: '#666' }}>Client ID</label><input style={{ ...styles.input, padding: '8px' }} value={localSettings.farmosClientId} onChange={e => setLocalSettings({ ...localSettings, farmosClientId: e.target.value })} /></div><div><label style={{ fontSize: '10px', color: '#666' }}>Client Secret</label><input style={{ ...styles.input, padding: '8px' }} type="password" value={localSettings.farmosClientSecret} onChange={e => setLocalSettings({ ...localSettings, farmosClientSecret: e.target.value })} /></div></div></div><div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}><label style={{ fontSize: '12px' }}>Sync Interval:</label><select style={{ ...styles.input, width: '150px' }} value={localSettings.farmosSyncInterval} onChange={e => setLocalSettings({ ...localSettings, farmosSyncInterval: parseInt(e.target.value) })}><option value={5}>Every 5 minutes</option><option value={15}>Every 15 minutes</option><option value={30}>Every 30 minutes</option><option value={60}>Every hour</option></select></div><div style={{ background: '#f0fdf4', padding: '12px', borderRadius: '8px' }}><div style={{ fontSize: '12px', fontWeight: '600', marginBottom: '8px', color: '#0f6e56' }}>Sync Options</div><div style={{ display: 'grid', gap: '6px' }}><label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}><input type="checkbox" checked={localSettings.farmosSyncHarvests} onChange={e => setLocalSettings({ ...localSettings, farmosSyncHarvests: e.target.checked })} /> Harvest logs → Inventory</label><label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}><input type="checkbox" checked={localSettings.farmosSyncSales} onChange={e => setLocalSettings({ ...localSettings, farmosSyncSales: e.target.checked })} /> Sales → farmOS observations</label><label style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px' }}><input type="checkbox" checked={localSettings.farmosSyncInventory} onChange={e => setLocalSettings({ ...localSettings, farmosSyncInventory: e.target.checked })} /> Import farmOS assets as products</label></div></div></>)}<button style={{ ...styles.button, ...styles.primaryBtn }} onClick={saveAdminSettings} disabled={adminSaving}>{adminSaving ? 'Saving...' : '💾 Save farmOS Settings'}</button></div></div>)}
          </div>
        );
      };

      // SETTLEMENT MODAL
      const SettlementModal = () => {
        const [processing, setProcessing] = useState(null);
        const [paidVendors, setPaidVendors] = useState({});
        
        // Calculate settlements from transactions state (loaded from Supabase)
        const vendorTotals = {};
        transactions.forEach(tx => {
          (tx.items || []).forEach(item => {
            if (!vendorTotals[item.vendorId]) {
              vendorTotals[item.vendorId] = { gross: 0, items: 0, commission: 0 };
            }
            vendorTotals[item.vendorId].gross += item.total || 0;
            vendorTotals[item.vendorId].items += 1;
            vendorTotals[item.vendorId].commission += item.commissionAmt || 0;
          });
        });
        
        const handleMarkPaid = async (vendor, totals, commission, netPayable) => {
          if (!confirm(`Mark ${vendor.name} as paid?\n\nGross: $${totals.gross.toFixed(2)}\nCommission: -$${commission.toFixed(2)}\nNet Payable: $${netPayable.toFixed(2)}`)) return;
          
          setProcessing(vendor.id);
          const today = new Date().toISOString().split('T')[0];
          const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
          
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.markSettlementPaid(
              vendor.id, thirtyDaysAgo, today, totals.gross, commission, netPayable
            );
            if (!result.success) {
              alert('Error: ' + result.error);
              setProcessing(null);
              return;
            }
          }
          
          setPaidVendors(prev => ({ ...prev, [vendor.id]: { date: today, amount: netPayable } }));
          setProcessing(null);
          alert(`Settlement recorded!\n\nPaid $${netPayable.toFixed(2)} to ${vendor.name}`);
        };
        
        return (
          <div style={styles.modal} onClick={() => setShowSettlement(false)}>
            <div style={{ ...styles.modalContent, maxWidth: '700px' }} onClick={e => e.stopPropagation()}>
              <h2 style={{ margin: '0 0 16px', fontSize: '18px' }}>💰 Vendor Settlement Report</h2>
              <div style={{ fontSize: '11px', color: '#666', marginBottom: '12px' }}>Based on {transactions.length} transaction(s) from Supabase</div>
              <div style={{ display: 'grid', gap: '10px' }}>
                {Object.values(vendors).filter(v => v.type === 'consignment').map(vendor => {
                  const totals = vendorTotals[vendor.id] || { gross: 0, items: 0, commission: 0 };
                  const commission = totals.commission > 0 ? totals.commission : totals.gross * (vendor.commissionRate / 100);
                  const netPayable = totals.gross - commission;
                  const isPaid = paidVendors[vendor.id];
                  
                  return (
                    <div key={vendor.id} style={{ padding: '14px', borderRadius: '10px', border: `2px solid ${isPaid ? '#22c55e' : vendor.color}`, background: isPaid ? '#f0fdf4' : totals.gross > 0 ? '#fafafa' : 'white' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                          <span style={{ width: '10px', height: '10px', borderRadius: '50%', background: vendor.color }} />
                          <span style={{ fontWeight: '600' }}>{vendor.name}</span>
                          <span style={{ fontSize: '10px', color: '#888' }}>{vendor.commissionRate}% commission</span>
                          {isPaid && <span style={{ fontSize: '10px', padding: '2px 6px', background: '#22c55e', color: 'white', borderRadius: '4px' }}>✓ Paid</span>}
                        </div>
                        {totals.gross > 0 && !isPaid && (
                          <button 
                            style={{ ...styles.button, ...styles.primaryBtn, padding: '4px 10px', fontSize: '10px' }}
                            onClick={() => handleMarkPaid(vendor, totals, commission, netPayable)}
                            disabled={processing === vendor.id}
                          >
                            {processing === vendor.id ? 'Processing...' : 'Mark Paid'}
                          </button>
                        )}
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', marginTop: '10px', fontSize: '11px' }}>
                        <div><div style={{ color: '#888' }}>Items Sold</div><div style={{ fontWeight: '600' }}>{totals.items}</div></div>
                        <div><div style={{ color: '#888' }}>Gross Sales</div><div style={{ fontWeight: '600' }}>${totals.gross.toFixed(2)}</div></div>
                        <div><div style={{ color: '#888' }}>Commission</div><div style={{ fontWeight: '600', color: '#dc2626' }}>-${commission.toFixed(2)}</div></div>
                        <div><div style={{ color: '#888' }}>Net Payable</div><div style={{ fontWeight: '700', color: isPaid ? '#22c55e' : '#0f6e56' }}>${netPayable.toFixed(2)}</div></div>
                      </div>
                    </div>
                  );
                })}
                {Object.values(vendors).filter(v => v.type === 'consignment').length === 0 && (
                  <div style={{ padding: '20px', textAlign: 'center', color: '#888' }}>No consignment vendors found</div>
                )}
              </div>
              <button style={{ ...styles.button, ...styles.secondaryBtn, width: '100%', marginTop: '16px' }} onClick={() => setShowSettlement(false)}>Close</button>
            </div>
          </div>
        );
      };

      // MAIN RENDER
      const dbClass = dbStatus.connected && dbStatus.tablesExist ? 'connected' : dbStatus.connected ? 'partial' : 'demo';
      const _dbUrl = (function(){ try { return JSON.parse(localStorage.getItem('farmhack-supabase-v1')||'{}').url||''; } catch(e){ return ''; } })();
      const dbText = dbStatus.loading ? '⏳' : dbStatus.connected && dbStatus.tablesExist ? (_dbUrl.startsWith('http://localhost')||_dbUrl.startsWith('http://127.') ? '🟢 Local DB' : '🟢 Supabase') : dbStatus.connected ? '🟡 No Tables' : '🟠 Demo';
      
      return (
        <div style={styles.app}>
          <div className={`db-status ${dbClass}`} title={dbStatus.error || (dbStatus.connected ? 'Connected' : 'Demo mode')}>{dbText}</div>
          <header style={styles.header}><div style={styles.logo}><span style={{ fontSize: '22px' }}>🌱</span><div><div>{settings.storeName.split(' ').slice(0, 3).join(' ')}</div><div style={{ fontSize: '9px', opacity: 0.8, fontWeight: '400' }}>{user.role.charAt(0).toUpperCase() + user.role.slice(1)}: {user.name}</div></div></div><div style={styles.tabs}>{availableViews.map(tab => (<button key={tab.id} style={{ ...styles.tab, ...(view === tab.id ? styles.tabActive : styles.tabInactive) }} onClick={() => setView(tab.id)}>{tab.label}</button>))}</div><div style={{ display: 'flex', gap: '6px' }}><button onClick={toggleFullscreen} title={isFullscreen ? 'Exit fullscreen' : 'Fullscreen'} style={{ ...styles.button, background: 'rgba(255,255,255,0.15)', color: 'white', fontSize: '13px', padding: '6px 10px' }}>{isFullscreen ? '⊞' : '⤢'}</button><button style={{ ...styles.button, background: 'rgba(255,255,255,0.15)', color: 'white', fontSize: '11px' }} onClick={logout}>Logout</button></div></header>
          {view === 'pos' && renderPOS()}
          {view === 'kiosk' && renderKiosk()}
          {view === 'vendors' && renderVendors()}
          {view === 'inventory' && renderInventory()}
          {view === 'admin' && renderAdmin()}
          {editingProduct !== null && <ProductEditModal product={editingProduct.id ? editingProduct : null} onClose={() => setEditingProduct(null)} />}
          {editingVendor !== null && <VendorEditModal vendor={editingVendor.id ? editingVendor : null} onClose={() => setEditingVendor(null)} />}
          {editingUser !== null && <UserEditModal userToEdit={editingUser.id ? editingUser : null} onClose={() => setEditingUser(null)} />}
          {editingDevice !== null && <DeviceEditModal deviceToEdit={editingDevice.id ? editingDevice : null} onClose={() => setEditingDevice(null)} />}
          {editingCustomer !== null && <CustomerEditModal customer={editingCustomer.id ? editingCustomer : null} onClose={() => setEditingCustomer(null)} />}
          {showPayment && <PaymentModal />}
          {showSettlement && <SettlementModal />}
        </div>
      );
    }

    // APP ROOT
    function App() { return <AuthProvider><AppContent /></AuthProvider>; }
    function AppContent() { const { user, loading } = useAuth(); if (loading) return <div className="loading">Loading...</div>; return user ? <MainApp /> : <LoginScreen />; }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
