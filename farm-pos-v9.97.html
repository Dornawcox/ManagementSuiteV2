<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Farm POS v8.2</title>
  <meta name="description" content="Cooperative Farm Store POS with multi-vendor consignment, role-based access, and peripheral device management">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    console.log('[POS] === VERSION 8.2 LOADING ===');
    
    // Check for URL parameters to set Supabase credentials
    (function() {
      const params = new URLSearchParams(window.location.search);
      const sbUrl = params.get('sb_url');
      const sbKey = params.get('sb_key');
      if (sbUrl && sbKey) {
        console.log('[POS] Found Supabase credentials in URL parameters');
        localStorage.setItem('farmhack-supabase-v1', JSON.stringify({ url: sbUrl, anonKey: sbKey }));
        // Remove params from URL to keep it clean (optional)
        // window.history.replaceState({}, '', window.location.pathname);
      }
    })();
    
    // ============================================
    // SUPABASE LAZY CONNECTOR
    // Does NOT connect on script load - call init() from React useEffect
    // ============================================
    window.SUPABASE_POS = {
      client: null,
      connected: false,
      tablesExist: false,
      error: null,
      creds: null,
      _initialized: false,
      
      init: function() {
        if (this._initialized) return this.connected;
        this._initialized = true;

        var LOCAL_JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTAwMDAwMDAwMCwiZXhwIjo5OTk5OTk5OTk5fQ.hyAvRV36tW_Qj8NflShZALPdutqW3nbGCRk9ZF3meWQ';
        try {
          this.creds = JSON.parse(localStorage.getItem('farmhack-supabase-v1')) || null;
        } catch(e) { this.creds = null; }

        // If the stored URL is a cloud Supabase (https://) use it as-is.
        // For everything else — localhost, LAN IP, hotspot IP — always derive
        // the API URL from the page's own origin so any device works without config.
        // NOTE: window.location.origin returns "null" for file:// URLs; use
        // protocol+host construction which degrades gracefully.
        var storedUrl = this.creds && this.creds.url;
        if (!storedUrl || !storedUrl.startsWith('https://')) {
          var proto = window.location.protocol;
          var host  = window.location.host; // includes port, e.g. "192.168.68.120:8080"
          var pageOrigin = (proto === 'http:' || proto === 'https:') && host
            ? proto + '//' + host
            : 'http://localhost:8080';
          this.creds = {
            url:     pageOrigin,
            anonKey: (this.creds && this.creds.anonKey) || LOCAL_JWT
          };
          localStorage.setItem('farmhack-supabase-v1', JSON.stringify(this.creds));
        }

        if (!this.creds || !this.creds.url || !this.creds.anonKey) {
          this.error = 'No credentials. Configure in Admin → Database.';
          return false;
        }
        
        if (typeof supabase === 'undefined') {
          this.error = 'Supabase library not loaded';
          return false;
        }
        
        try {
          this.client = supabase.createClient(this.creds.url, this.creds.anonKey);
          this.connected = true;
          this.error = null;
          console.log('[POS] Supabase connected');
          return true;
        } catch(e) {
          this.error = e.message;
          return false;
        }
      },
      
      checkTables: async function() {
        if (!this.client && !this.init()) return false;
        try {
          // Try to check pos_vendors first (simpler table)
          var v = await this.client.from('pos_vendors').select('id').limit(1);
          if (v.error) {
            console.error('[POS] pos_vendors check failed:', v.error);
            this.tablesExist = false;
            this.error = 'POS tables not found. Run pos_standalone_schema.sql in Supabase SQL Editor.';
            return false;
          }
          
          // Then check products
          var p = await this.client.from('pos_products').select('id').limit(1);
          if (p.error) {
            console.error('[POS] pos_products check failed:', p.error);
            this.tablesExist = false;
            this.error = 'pos_products table error: ' + p.error.message;
            return false;
          }
          
          this.tablesExist = true;
          this.error = null;
          console.log('[POS] Tables verified OK');
          return true;
        } catch(e) { 
          console.error('[POS] checkTables exception:', e);
          this.tablesExist = false; 
          this.error = e.message; 
          return false; 
        }
      },
      
      // Ensure default categories exist
      ensureCategories: async function() {
        if (!this.client) return false;
        var cats = [
          { id: 'vegetables', name: 'Vegetables', sort_order: 1, icon: '🥬' },
          { id: 'fruit', name: 'Fruit', sort_order: 2, icon: '🍎' },
          { id: 'eggs', name: 'Eggs', sort_order: 3, icon: '🥚' },
          { id: 'dairy', name: 'Dairy', sort_order: 4, icon: '🧀' },
          { id: 'meat', name: 'Meat', sort_order: 5, icon: '🥩' },
          { id: 'preserves', name: 'Preserves', sort_order: 6, icon: '🍯' }
        ];
        for (var i = 0; i < cats.length; i++) {
          await this.client.from('pos_categories').upsert(cats[i], { onConflict: 'id' });
        }
        console.log('[POS] Categories ensured');
        return true;
      },
      
      fetchProducts: async function() {
        if (!this.client) return null;
        try {
          var r = await this.client.from('pos_products').select('*').eq('is_active', true);
          if (r.error) { console.error('[POS] fetchProducts error:', r.error); return null; }
          return r.data;
        } catch(e) { console.error('[POS] fetchProducts exception:', e); return null; }
      },
      
      fetchVendors: async function() {
        if (!this.client) return null;
        try {
          var r = await this.client.from('pos_vendors').select('*').eq('is_active', true);
          if (r.error) { console.error('[POS] fetchVendors error:', r.error); return null; }
          return r.data;
        } catch(e) { console.error('[POS] fetchVendors exception:', e); return null; }
      },
      
      fetchSettings: async function() {
        if (!this.client) return null;
        try {
          // Settings are stored as key/value pairs with JSONB values
          var r = await this.client.from('pos_settings').select('*');
          if (r.error) { console.error('[POS] fetchSettings error:', r.error); return null; }
          // Convert key/value rows to single object
          var settings = {};
          if (r.data) {
            r.data.forEach(function(row) {
              settings[row.key] = row.value;
            });
          }
          console.log('[POS] Fetched settings:', Object.keys(settings));
          return settings;
        } catch(e) { console.error('[POS] fetchSettings exception:', e); return null; }
      },
      
      fetchTransactions: async function() {
        if (!this.client) return [];
        try {
          // Fetch transactions with their items
          var txR = await this.client.from('pos_transactions').select('*').order('created_at', { ascending: false }).limit(100);
          if (txR.error) { console.error('[POS] fetchTransactions error:', txR.error); return []; }
          
          var transactions = [];
          for (var i = 0; i < (txR.data || []).length; i++) {
            var tx = txR.data[i];
            // Fetch items for this transaction
            var itemsR = await this.client.from('pos_transaction_items').select('*').eq('transaction_id', tx.id);
            var items = (itemsR.data || []).map(function(item) {
              return {
                productId: item.product_id,
                vendorId: item.vendor_id,
                quantity: parseFloat(item.quantity),
                price: parseFloat(item.unit_price),
                total: parseFloat(item.line_total),
                commissionRate: parseFloat(item.commission_rate),
                commissionAmt: parseFloat(item.commission_amt)
              };
            });
            transactions.push({
              id: tx.id,
              transactionNum: tx.transaction_num,
              date: tx.created_at,
              items: items,
              subtotal: parseFloat(tx.subtotal),
              tax: parseFloat(tx.tax_amount),
              total: parseFloat(tx.total),
              paymentMethod: tx.payment_method,
              cashier: tx.cashier_id,
              status: tx.status
            });
          }
          console.log('[POS] Fetched transactions:', transactions.length);
          return transactions;
        } catch(e) { console.error('[POS] fetchTransactions exception:', e); return []; }
      },
      
      saveSettings: async function(s) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          // Settings are stored as key/value pairs with JSONB values
          var rows = [
            { key: 'store', value: { name: s.storeName, address: s.storeAddress, phone: s.storePhone, email: s.storeEmail } },
            { key: 'receipt', value: { header: s.receiptHeader, footer: s.receiptFooter } },
            { key: 'kiosk', value: { enabled: s.kioskEnabled, timeout: s.kioskTimeout } },
            { key: 'payment', value: { processor: s.paymentProcessor, testMode: s.paymentTestMode } }
          ];
          
          for (var i = 0; i < rows.length; i++) {
            var r = await this.client.from('pos_settings').upsert(rows[i], { onConflict: 'key' });
            if (r.error) { console.error('[POS] saveSettings error for', rows[i].key, ':', r.error); }
          }
          console.log('[POS] Settings saved');
          return { success: true };
        } catch(e) { console.error('[POS] saveSettings exception:', e); return { success: false, error: e.message }; }
      },
      
      saveTransaction: async function(tx, items) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var txR = await this.client.from('pos_transactions').insert(tx).select().single();
          if (txR.error) { console.error('[POS] saveTransaction error:', txR.error); throw txR.error; }
          var itemsData = items.map(function(i) { 
            var copy = {}; for (var k in i) copy[k] = i[k];
            copy.transaction_id = txR.data.id;
            return copy;
          });
          var itemsR = await this.client.from('pos_transaction_items').insert(itemsData);
          if (itemsR.error) { console.error('[POS] saveTransactionItems error:', itemsR.error); throw itemsR.error; }
          console.log('[POS] Transaction saved:', txR.data.id);
          return { success: true, data: txR.data };
        } catch(e) { console.error('[POS] saveTransaction exception:', e); return { success: false, error: e.message }; }
      },
      
      saveProduct: async function(p) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          console.log('[POS] saveProduct called with:', p);
          
          // Ensure vendor exists first
          var vendorCheck = await this.client.from('pos_vendors').select('id').eq('id', p.vendorId).single();
          if (vendorCheck.error) {
            console.log('[POS] Vendor not found:', p.vendorId, '- creating it');
            var vendorCreate = await this.client.from('pos_vendors').upsert({
              id: p.vendorId,
              name: p.vendorId.replace(/-/g, ' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); }),
              vendor_type: 'consignment',
              commission_rate: 15,
              is_active: true
            }, { onConflict: 'id' });
            if (vendorCreate.error) {
              console.error('[POS] Failed to create vendor:', vendorCreate.error);
              return { success: false, error: 'Failed to create vendor: ' + vendorCreate.error.message };
            }
          }
          
          // Ensure category exists
          var catCheck = await this.client.from('pos_categories').select('id').eq('id', p.category || 'vegetables').single();
          if (catCheck.error) {
            console.log('[POS] Category not found:', p.category, '- creating it');
            var catCreate = await this.client.from('pos_categories').upsert({
              id: p.category || 'vegetables',
              name: (p.category || 'vegetables').charAt(0).toUpperCase() + (p.category || 'vegetables').slice(1),
              sort_order: 99,
              icon: '📦',
              is_active: true
            }, { onConflict: 'id' });
            if (catCreate.error) {
              console.error('[POS] Failed to create category:', catCreate.error);
            }
          }
          
          var d = {
            id: p.id || 'p_' + Date.now(),
            name: p.name, 
            price: parseFloat(p.price), 
            cost: p.cost ? parseFloat(p.cost) : null,
            markup: p.markup ? parseFloat(p.markup) : null,
            unit: p.unit || 'each',
            unit_type: p.unitType || 'each', 
            stock: parseInt(p.stock) || 0,
            min_stock: parseInt(p.minStock) || 5, 
            barcode: p.barcode || null,
            image_url: p.image || null, 
            vendor_id: p.vendorId,
            category_id: p.category || 'vegetables', 
            is_active: true
          };
          
          console.log('[POS] Upserting product:', d);
          var r = await this.client.from('pos_products').upsert(d, { onConflict: 'id' }).select().single();
          if (r.error) { 
            console.error('[POS] saveProduct error:', r.error); 
            return { success: false, error: r.error.message + ' (code: ' + r.error.code + ')' }; 
          }
          console.log('[POS] Product saved successfully:', r.data);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveProduct exception:', e); return { success: false, error: e.message }; }
      },
      
      saveVendor: async function(v) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var d = {
            id: v.id || v.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, ''),
            name: v.name, 
            vendor_type: v.type || 'consignment',
            commission_rate: parseFloat(v.commissionRate) || 0,
            contact_email: v.contact || null,
            payment_method: v.paymentMethod || 'check',
            payment_terms: v.paymentTerms || 'net-15',
            color: v.color || '#666666', 
            is_active: v.active !== false
          };
          var r = await this.client.from('pos_vendors').upsert(d, { onConflict: 'id' }).select().single();
          if (r.error) { console.error('[POS] saveVendor error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Vendor saved:', d.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveVendor exception:', e); return { success: false, error: e.message }; }
      },
      
      deleteProduct: async function(id) {
        if (!this.client) return false;
        try {
          var r = await this.client.from('pos_products').update({ is_active: false }).eq('id', id);
          if (r.error) { console.error('[POS] deleteProduct error:', r.error); return false; }
          console.log('[POS] Product deleted:', id);
          return true;
        } catch(e) { console.error('[POS] deleteProduct exception:', e); return false; }
      },
      
      deleteVendor: async function(id) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          // Check if vendor has any products
          var prodCheck = await this.client.from('pos_products').select('id').eq('vendor_id', id).eq('is_active', true).limit(1);
          if (prodCheck.data && prodCheck.data.length > 0) {
            return { success: false, error: 'Cannot delete vendor with active products. Delete or reassign products first.' };
          }
          // Check if vendor has any transactions
          var txCheck = await this.client.from('pos_transaction_items').select('id').eq('vendor_id', id).limit(1);
          if (txCheck.data && txCheck.data.length > 0) {
            // Soft delete - has transaction history
            var r = await this.client.from('pos_vendors').update({ is_active: false }).eq('id', id);
            if (r.error) { console.error('[POS] deleteVendor error:', r.error); return { success: false, error: r.error.message }; }
            console.log('[POS] Vendor soft deleted (has transactions):', id);
            return { success: true, softDelete: true };
          }
          // Hard delete - no transaction history
          var r = await this.client.from('pos_vendors').delete().eq('id', id);
          if (r.error) { console.error('[POS] deleteVendor error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Vendor hard deleted:', id);
          return { success: true };
        } catch(e) { console.error('[POS] deleteVendor exception:', e); return { success: false, error: e.message }; }
      },
      
      // Mark settlement as paid
      markSettlementPaid: async function(vendorId, periodStart, periodEnd, grossSales, commission, netPayable) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var settlement = {
            vendor_id: vendorId,
            period_start: periodStart,
            period_end: periodEnd,
            gross_sales: grossSales,
            commission: commission,
            net_payable: netPayable,
            status: 'paid',
            paid_at: new Date().toISOString()
          };
          var r = await this.client.from('pos_settlements').insert(settlement).select().single();
          if (r.error) { console.error('[POS] markSettlementPaid error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Settlement marked paid:', r.data.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] markSettlementPaid exception:', e); return { success: false, error: e.message }; }
      },
      
      // User management
      fetchUsers: async function() {
        if (!this.client) return [];
        try {
          var r = await this.client.from('pos_users').select('*').order('created_at', { ascending: true });
          if (r.error) { 
            if (r.error.code === '42P01') { // Table doesn't exist
              console.log('[POS] pos_users table not found, using defaults');
              return null; 
            }
            console.error('[POS] fetchUsers error:', r.error); 
            return null; 
          }
          console.log('[POS] Fetched users:', r.data?.length || 0);
          return r.data || [];
        } catch(e) { console.error('[POS] fetchUsers exception:', e); return null; }
      },
      
      saveUser: async function(u) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var d = {
            id: u.id,
            username: u.username,
            pin: u.pin,
            name: u.name,
            email: u.email || null,
            role: u.role,
            permissions: u.permissions || [],
            is_active: u.active !== false
          };
          var r = await this.client.from('pos_users').upsert(d, { onConflict: 'id' }).select().single();
          if (r.error) { console.error('[POS] saveUser error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] User saved:', d.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveUser exception:', e); return { success: false, error: e.message }; }
      },
      
      deleteUser: async function(id) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var r = await this.client.from('pos_users').delete().eq('id', id);
          if (r.error) { console.error('[POS] deleteUser error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] User deleted:', id);
          return { success: true };
        } catch(e) { console.error('[POS] deleteUser exception:', e); return { success: false, error: e.message }; }
      },
      
      // Device management
      fetchDevices: async function() {
        if (!this.client) return [];
        try {
          var r = await this.client.from('pos_devices').select('*').order('created_at', { ascending: true });
          if (r.error) { 
            console.error('[POS] fetchDevices error:', r.error); 
            return null; 
          }
          console.log('[POS] Fetched devices:', r.data?.length || 0);
          return r.data || [];
        } catch(e) { console.error('[POS] fetchDevices exception:', e); return null; }
      },
      
      saveDevice: async function(d) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var data = {
            id: d.id,
            name: d.name,
            device_type: d.type,
            model: d.model || null,
            connection: d.connection || 'usb',
            port: d.port || null,
            status: d.status || 'disconnected',
            is_enabled: d.enabled !== false,
            config: d.config || {}
          };
          var r = await this.client.from('pos_devices').upsert(data, { onConflict: 'id' }).select().single();
          if (r.error) { console.error('[POS] saveDevice error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Device saved:', d.id);
          return { success: true, data: r.data };
        } catch(e) { console.error('[POS] saveDevice exception:', e); return { success: false, error: e.message }; }
      },
      
      deleteDevice: async function(id) {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var r = await this.client.from('pos_devices').delete().eq('id', id);
          if (r.error) { console.error('[POS] deleteDevice error:', r.error); return { success: false, error: r.error.message }; }
          console.log('[POS] Device deleted:', id);
          return { success: true };
        } catch(e) { console.error('[POS] deleteDevice exception:', e); return { success: false, error: e.message }; }
      },
      
      // Export functions
      exportToCSV: function(data, filename) {
        if (!data || data.length === 0) { alert('No data to export'); return; }
        var headers = Object.keys(data[0]);
        var csv = headers.join(',') + '\n';
        data.forEach(function(row) {
          csv += headers.map(function(h) {
            var val = row[h];
            if (val === null || val === undefined) return '';
            if (typeof val === 'object') val = JSON.stringify(val);
            val = String(val).replace(/"/g, '""');
            if (val.includes(',') || val.includes('"') || val.includes('\n')) val = '"' + val + '"';
            return val;
          }).join(',') + '\n';
        });
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename + '_' + new Date().toISOString().split('T')[0] + '.csv';
        link.click();
      },
      
      exportDatabaseBackup: async function() {
        if (!this.client) return { success: false, error: 'Not connected' };
        try {
          var backup = { 
            exportDate: new Date().toISOString(),
            version: '7.7',
            tables: {}
          };
          
          // Export all tables
          var tables = ['pos_vendors', 'pos_categories', 'pos_products', 'pos_transactions', 'pos_transaction_items', 'pos_settlements', 'pos_settings', 'pos_users', 'pos_devices'];
          for (var i = 0; i < tables.length; i++) {
            var r = await this.client.from(tables[i]).select('*');
            backup.tables[tables[i]] = r.data || [];
            console.log('[POS] Exported', tables[i], ':', (r.data || []).length, 'rows');
          }
          
          // Download as JSON
          var blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          var link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'pos_backup_' + new Date().toISOString().split('T')[0] + '.json';
          link.click();
          
          return { success: true, tables: Object.keys(backup.tables).length };
        } catch(e) { 
          console.error('[POS] exportDatabaseBackup error:', e); 
          return { success: false, error: e.message };

    // NFC/RFID HARDWARE MODULE

    // Uses Web Serial API for direct hardware access
    // ============================================
    window.NFC_RFID = {
      connected: false, lastCardUid: null, onCardRead: null, _pollTimer: null, _bridgeUrl: null,
      isSupported: function() { return true; },
      connect: function(bridgeUrl) {
        var self = this; var url = bridgeUrl || 'http://localhost:5002'; self._bridgeUrl = url;
        return fetch(url + '/status').then(function(r){return r.json();}).then(function(d){
          if (d.online) { self.connected = true; self._startBridgePoll(url); return {success:true,reader:d.reader}; }
          return {success:false,error:'Bridge offline'};
        }).catch(function(e){return {success:false,error:'Cannot reach '+url};});
      },
      disconnect: function() {
        if (this._pollTimer) { clearInterval(this._pollTimer); this._pollTimer = null; }
        this.connected = false; this.lastCardUid = null; return Promise.resolve();
      },
      _startBridgePoll: function(url) {
        var self = this; var lastUid = null;
        if (self._pollTimer) clearInterval(self._pollTimer);
        self._pollTimer = setInterval(function() {
          if (!self.connected) { clearInterval(self._pollTimer); return; }
          fetch(url + '/uid').then(function(r){return r.json();}).then(function(d){
            if (d.uid && d.uid !== lastUid) { lastUid=d.uid; self.lastCardUid=d.uid; if(self.onCardRead)self.onCardRead(d.uid); }
            if (!d.uid) lastUid = null;
          }).catch(function(){clearInterval(self._pollTimer);self.connected=false;});
        }, 300);
      },
      simulateCardRead: function(uid) { uid=uid||'04:AB:CD:EF:12:34'; this.lastCardUid=uid; if(this.onCardRead)this.onCardRead(uid); return uid; }
    };

    // DOOR ACCESS MODULE (Raspberry Pi GPIO)

    window.DOOR_ACCESS = {
      // Check access for a card UID
      checkAccess: async function(cardUid) {
        const customer = await window.SUPABASE_POS.findCustomerByCard(cardUid);
        if (!customer) {
          return { allowed: false, reason: 'Card not registered' };
        }
        if (!customer.door_access) {
          return { allowed: false, reason: 'Door access not enabled', customer };
        }
        if (!customer.is_active) {
          return { allowed: false, reason: 'Account inactive', customer };
        }
        
        // Check access hours if specified
        if (customer.door_access_hours && customer.door_access_hours !== '24/7') {
          const now = new Date();
          const currentTime = now.getHours() * 100 + now.getMinutes();
          const [start, end] = customer.door_access_hours.split('-').map(t => {
            const [h, m] = t.trim().split(':');
            return parseInt(h) * 100 + parseInt(m || 0);
          });
          if (currentTime < start || currentTime > end) {
            return { allowed: false, reason: 'Outside access hours', customer };
          }
        }
        
        return { allowed: true, customer };
      },

      // Connect to scale via Web Serial API
      connect: async function(options) {
        if (!navigator.serial) {
          return { success: false, error: 'Web Serial API not supported. Use Chrome or Edge.' };
        }
        
        try {
          // Merge options with config
          if (options) {
            Object.assign(this.config, options);
          }
          
          // Map parity setting
          let parity = 'none';
          if (this.config.parity === 'odd' || this.config.parity === '7O1') parity = 'odd';
          if (this.config.parity === 'even' || this.config.parity === '7E1') parity = 'even';
          
          // Request port
          this.port = await navigator.serial.requestPort({
            filters: [
              { usbVendorId: 0x0403 },  // FTDI
              { usbVendorId: 0x1A86 },  // CH340
              { usbVendorId: 0x067B },  // Prolific
              { usbVendorId: 0x10C4 },  // Silicon Labs
            ]
          });
          
          // Open port
          await this.port.open({
            baudRate: this.config.baudRate,
            dataBits: this.config.dataBits,
            stopBits: this.config.stopBits,
            parity: parity,
            flowControl: 'none'
          });
          
          this.reader = this.port.readable.getReader();
          this.writer = this.port.writable.getWriter();
          this.connected = true;
          
          console.log('[SCALE] Connected at', this.config.baudRate, 'baud');
          
          // Start reading if continuous mode
          if (this.config.outputMode === 'CONT') {
            this.startContinuousReading();
          }
          
          return { success: true };
        } catch (e) {
          console.error('[SCALE] Connection error:', e);
          return { success: false, error: e.message };
        }

          }
          if (this.writer) {
            this.writer.releaseLock();
          }
          if (this.port) {
            await this.port.close();
          }
        } catch (e) {
          console.error('[SCALE] Disconnect error:', e);
        }
        this.connected = false;
        this.port = null;
        this.reader = null;
        this.writer = null;
        console.log('[SCALE] Disconnected');
      },
      
      // Send command to scale
      sendCommand: async function(cmd) {
        if (!this.writer) return null;
        try {
          const encoder = new TextEncoder();
          await this.writer.write(encoder.encode(cmd));
          return true;
        } catch (e) {
          console.error('[SCALE] Send error:', e);
          return false;
        }
      },
      
      // Read response from scale
      readResponse: async function(timeout) {
        if (!this.reader) return null;
        timeout = timeout || 500;
        
        const buffer = [];
        const startTime = Date.now();
        
        try {
          while (Date.now() - startTime < timeout) {
            const { value, done } = await Promise.race([
              this.reader.read(),
              new Promise((_, reject) => setTimeout(() => reject('timeout'), timeout))
            ]);
            
            if (done) break;
            if (value) {
              buffer.push(...value);
              // Check for end of response (ETX or CR)
              if (value.includes(0x03) || value.includes(0x0D)) {
                break;
              }
            }
          }
          return new Uint8Array(buffer);
        } catch (e) {
          if (e !== 'timeout') console.error('[SCALE] Read error:', e);
          return buffer.length > 0 ? new Uint8Array(buffer) : null;
        }

        if (response && protocol.parseResponse) {
          const data = protocol.parseResponse(response);
          if (data) {
            this.currentWeight = data.weight;
            this.currentUnit = data.unit;
            this.isStable = data.stable;
            this.isZero = data.zero;
            this.isOverCapacity = data.overCapacity;
            this.isUnderCapacity = data.underCapacity;
            this.lastReading = new Date();
            
            if (this.onWeightChange) {
              this.onWeightChange(data);
            }
            if (data.stable && this.onStableWeight) {
              this.onStableWeight(data);
            }
          }
          return data;
        }
        return null;

        console.log('[SCALE] Zero command sent');

      // Parse NCI (SCP01) response
      // Format: <LF><P>W1W2W3W4W5<DP>W6 U1U2U3U4U5<CR><LF> H1H2H3H4<CR><ETX>
      parseNCIResponse: function(str) {
        try {
          // Remove control characters
          str = str.replace(/[\x00-\x09\x0B\x0C\x0E-\x1F]/g, '');
          
          // Check for error conditions
          if (str.includes('^^^^^^^^')) return { error: 'Over capacity', overCapacity: true };
          if (str.includes('________')) return { error: 'Under capacity', underCapacity: true };
          if (str.includes('--------')) return { error: 'Zero point error' };
          
          // Extract weight and unit
          const match = str.match(/([- ])(\d+\.?\d*)\s*(kg|lb|oz|g|pcs|lb:oz)/i);
          if (match) {
            const polarity = match[1] === '-' ? -1 : 1;
            const weight = parseFloat(match[2]) * polarity;
            const unit = match[3].toLowerCase();
            
            // Parse status bytes (H1H2H3H4)
            const statusMatch = str.match(/[\x30-\x7F]{4}$/);
            let stable = true, zero = false;
            
            if (statusMatch) {
              const h1 = statusMatch[0].charCodeAt(0);
              stable = !(h1 & 0x01);  // Bit 0 = motion
              zero = !!(h1 & 0x02);   // Bit 1 = at zero
            }
            
            return { weight, unit, stable, zero, overCapacity: false, underCapacity: false };
          }
        } catch (e) {
          console.error('[SCALE] Parse NCI error:', e);
        }
        return null;
      },

      parseECRResponse: function(str) {

              stable: true,
              zero: false,
              overCapacity: false,
              underCapacity: false

    const AuthContext = createContext(null);

    const AuthProvider = ({ children }) => {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const savedUser = localStorage.getItem('pos_user');
        if (savedUser) setUser(JSON.parse(savedUser));
        setLoading(false);
      }, []);

      const login = async (username, pin) => {
        const foundUser = USERS.find(u => u.username === username && u.pin === pin && u.active);
        if (foundUser) {
          const userData = { ...foundUser, pin: undefined };
          setUser(userData);
          localStorage.setItem('pos_user', JSON.stringify(userData));
          return { success: true, user: userData };
        }
        return { success: false, error: 'Invalid credentials' };
      };

      const logout = () => { setUser(null); localStorage.removeItem('pos_user'); };
      const hasPermission = (permission) => { if (!user) return false; if (user.permissions?.includes('all')) return true; return user.permissions?.includes(permission); };

      return <AuthContext.Provider value={{ user, login, logout, hasPermission, loading }}>{children}</AuthContext.Provider>;
    };

      useEffect(function() {

          var isOtherInput = (tag === 'INPUT' || tag === 'TEXTAREA') && el.id !== 'barcodeScanner';
          if (isOtherInput) return;
          if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(tmr);
            var scan = (el && el.id === 'barcodeScanner') ? el.value : buf;
            buf = '';
            if (scan.trim().length >= 2 && window._posScanner) window._posScanner(scan.trim());
            return;
          }
          if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
            buf += e.key;
            clearTimeout(tmr);
            tmr = setTimeout(function() {
              var s = buf; buf = '';
              if (s.trim().length >= 3 && window._posScanner) window._posScanner(s.trim());

      // ── Label Printer Bridge ─────────────────────────────────────────────
      // Sends ZPL to the local Python bridge (print-bridge.py on the Pi).
      // Falls back to showing the ZPL in a window for copy-paste if no bridge.
      window.LABEL_PRINTER = {
        send: async function(zpl) {
          var cfg = labelConfig;
          try {
            var resp = await fetch(cfg.bridgeUrl + '/print', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ queue: cfg.queue, zpl: zpl })
            });
            var data = await resp.json();
            return { success: resp.ok, msg: data.message || data.error || '' };
          } catch(e) {
            return { success: false, msg: 'Bridge not reachable: ' + e.message };
          }
        },
        status: async function() {
          try {
            var resp = await fetch(labelConfig.bridgeUrl + '/status', { signal: AbortSignal.timeout(2000) });
            var data = await resp.json();
            return { online: true, queues: data.queues || [], version: data.version || '' };
          } catch(e) {
            return { online: false, queues: [], error: e.message };
          }
        },
        calibrate: async function() {
          // ~JC = auto-calibrate label gap/black mark
          // ~JD = enable label-top sensing
          return await this.send('^XA~JC^XZ');
        },
        feedLabel: async function() {
          // ^XA~FF^XZ — embed form-feed immediate command in a format block
          // Same pattern as calibrate (^XA~JC^XZ) which is confirmed working
          return await this.send('^XA~FF^XZ');
        },
        // Sanitise text going into ^FD — strip ^ ~ and control chars
        _safe: function(str) {
          return (str || '').replace(/[\^~\x00-\x1F]/g, ' ').substring(0, 36);
        },
        // Build date string safe for ZPL (no commas)
        _dateStr: function() {
          var d = new Date();
          return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')
               + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
        },
        // Minimal test — simplest possible ZPL, good for diagnosing driver issues
        minimalTest: async function(cfg) {
          var zpl = '^XA^FO30,30^A0N,40,40^FDZD411 OK^FS^XZ';
          return await this.send(zpl);
        },
        testLabel: async function(cfg, storeName) {
          var dpi = parseInt(cfg.dpi) || 203;
          var w = Math.round(parseFloat(cfg.labelWidth) * dpi);
          var h = Math.round(parseFloat(cfg.labelHeight) * dpi);
          var bar = w - 30;
          var name = this._safe(storeName || 'Farm Store');
          // Scale font and positions proportionally to label height
          var fLg = Math.round(h * 0.18);   // ~18% of height for large font
          var fSm = Math.round(h * 0.12);   // ~12% for small font
          fLg = Math.max(16, Math.min(fLg, 40));
          fSm = Math.max(12, Math.min(fSm, 24));
          var y1 = 8;
          var y2 = y1 + fLg + 4;
          var y3 = y2 + fSm + 4;
          var y4 = y3 + fSm + 2;
          var y5 = y4 + fSm + 2;
          var zpl = [
            '^XA',
            '^PW' + w,
            '^LL' + h,
            '^LH0,0',
            '^MTD',              // Direct thermal media type
            '^MNY',              // Media sensing: web/gap
            '^FO5,' + y1 + '^A0N,' + fLg + ',' + fLg + '^FB' + (w-10) + ',1,0,C^FD' + name + '^FS',
            '^FO15,' + y2 + '^GB' + bar + ',2,2^FS',
            '^FO15,' + (y2+4) + '^A0N,' + fSm + ',' + fSm + '^FDTEST LABEL^FS',
            '^FO15,' + (y3+4) + '^A0N,' + fSm + ',' + fSm + '^FD' + cfg.labelWidth + 'x' + cfg.labelHeight + 'in ' + dpi + 'dpi^FS',
            '^FO15,' + (y4+4) + '^A0N,' + fSm + ',' + fSm + '^FD' + this._dateStr() + '^FS',
            '^FO15,' + (h-8) + '^GB' + bar + ',2,2^FS',
            '^XZ'
          ].join('');
          return await this.send(zpl);
        },
        productLabel: function(product, vendor, cfg) {
          var dpi     = parseInt(cfg.dpi) || 203;
          var w       = Math.round(parseFloat(cfg.labelWidth)  * dpi);
          var h       = Math.round(parseFloat(cfg.labelHeight) * dpi);
          var align   = cfg.textAlign || 'center';   // 'center' | 'left'
          var bcSize  = cfg.barcodeSize || 'medium'; // 'small' | 'medium' | 'large'
          var byMult  = bcSize === 'small' ? 1 : bcSize === 'large' ? 3 : 2;

          var name      = this._safe(product.name || '');
          var price     = '$' + parseFloat(product.price).toFixed(2) + (product.unit ? '/' + product.unit : '');
          var vendorName = vendor ? this._safe(vendor.name) : '';
          var barcode   = (product.barcode || '').replace(/[^0-9A-Za-z\-\.\/]/g, '');

          // Font sizes proportional to label height
          var fName  = Math.max(16, Math.min(Math.round(h * 0.18), 36));
          var fPrice = Math.max(20, Math.min(Math.round(h * 0.25), 44));
          var fSm    = Math.max(12, Math.min(Math.round(h * 0.12), 20));

          // Field helpers — centred uses ^FB across full width, left uses ^FO with margin
          var textField = function(y, fh, text) {
            if (align === 'center') {
              // ^FO0,y ^A0N,h,h ^FBw,1,0,C ^FDtext^FS
              return '^FO0,' + y + '^A0N,' + fh + ',' + fh + '^FB' + w + ',1,0,C^FD' + text + '^FS';
            } else {
              return '^FO12,' + y + '^A0N,' + fh + ',' + fh + '^FD' + text + '^FS';
            }
          };

          var y = 6;
          var lines = ['^XA', '^PW' + w, '^LL' + h, '^LH0,0', '^MTD', '^MNY'];

          lines.push(textField(y, fName, name));
          y += fName + 5;

          lines.push(textField(y, fPrice, price));
          y += fPrice + 4;

          if (vendorName) {
            lines.push(textField(y, fSm, vendorName));
            y += fSm + 4;
          }

          if (barcode && y + 40 < h) {
            var bcH = Math.min(60, h - y - 12);
            if (align === 'center') {
              lines.push('^FO0,' + y + '^FB' + w + ',1,0,C^BY' + byMult + ',2,' + bcH + '^BCN,' + bcH + ',Y,N,N^FD' + barcode + '^FS');
            } else {
              lines.push('^FO12,' + y + '^BY' + byMult + ',2,' + bcH + '^BCN,' + bcH + ',Y,N,N^FD' + barcode + '^FS');
            }
          }

          lines.push('^XZ');
          return lines.join('');
        }
      };

          .catch(function(e) { return { success: false, msg: 'Bridge not reachable: ' + e.message }; });
        },
        status: function() {
          return fetch(receiptConfig.bridgeUrl + '/status', { signal: AbortSignal.timeout(2000) })
            .then(function(r) { return r.json().then(function(d) { return { online: true, queues: d.queues || [] }; }); })
            .catch(function(e) { return { online: false, error: e.message }; });
        },
        buildReceipt: function(sale) {
          var w = parseInt(receiptConfig.width) || 48;
          var lines = [];
          var centre = function(s) { s = String(s||''); var pad = Math.max(0, Math.floor((w - s.length) / 2)); return ' '.repeat(pad) + s; };
          var rule = '-'.repeat(w);
          var lr = function(l, r) { l=String(l||''); r=String(r||''); var gap = Math.max(1, w - l.length - r.length); return l + ' '.repeat(gap) + r; };
          lines.push(centre(sale.store));
          lines.push(centre(sale.date));
          lines.push(rule);
          sale.byVendor.forEach(function(v) {
            lines.push(v.vendor + ':');
            v.items.forEach(function(item) {
              var qty = item.isWeight ? item.quantity.toFixed(2) + ' lb' : item.quantity > 1 ? 'x' + item.quantity : '';
              var name = '  ' + item.name + (qty ? ' ' + qty : '');
              lines.push(lr(name.substring(0, w - 9), '$' + item.total.toFixed(2)));
            });
          });
          lines.push(rule);
          if (sale.discountPct > 0) lines.push(lr('Discount ' + sale.discountPct + '%', '-$' + sale.discount.toFixed(2)));
          lines.push(lr('TOTAL', '$' + sale.total.toFixed(2)));
          lines.push(lr('Payment', sale.method));
          if (sale.customer) lines.push(lr('Customer', sale.customer));
          lines.push(rule);
          if (sale.footer) lines.push(centre(sale.footer));
          lines.push('');
          lines.push('');
          return lines;
        }
      };

      };

      // PRODUCT EDIT MODAL
      const ProductEditModal = ({ product, onClose }) => {
        const vendorIds = Object.keys(vendors);
        const defaultVendor = vendorIds.length > 0 ? vendorIds[0] : 'farm-store';
        const [form, setForm] = useState(product || { name: '', price: '', cost: '', markup: 50, category: 'vegetables', unitType: 'each', unit: 'each', stock: '', barcode: `00${Date.now().toString().slice(-5)}`, vendorId: defaultVendor, minStock: 10 });

        const [saveError, setSaveError] = useState(null);
        const [pricingMode, setPricingMode] = useState(form.cost ? 'markup' : 'manual');
        const selectedUnitType = UNIT_TYPES.find(u => u.id === form.unitType);
        
        // Calculate price from cost + markup
        const calculatePrice = (cost, markup) => {
          if (!cost || isNaN(parseFloat(cost))) return '';
          return (parseFloat(cost) * (1 + (parseFloat(markup) || 0) / 100)).toFixed(2);
        };
        
        // Update price when cost or markup changes
        const updateCostMarkup = (field, value) => {
          const newForm = { ...form, [field]: value };
          if (pricingMode === 'markup' && (field === 'cost' || field === 'markup')) {
            newForm.price = calculatePrice(field === 'cost' ? value : form.cost, field === 'markup' ? value : form.markup);
          }
          setForm(newForm);
        };
        
        const handleSave = async () => {
          setSaving(true);
          setSaveError(null);
          const data = { 
            ...form, 
            id: product?.id || `${form.category[0]}${Date.now()}`, 
            price: parseFloat(form.price), 
            cost: parseFloat(form.cost) || null,
            markup: parseFloat(form.markup) || null,
            stock: parseInt(form.stock) || 0, 
            image: form.image || 'https://images.unsplash.com/photo-1518843875459-f738682238a6?w=300&h=300&fit=crop' 
          };
          
          // Save to Supabase if connected
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.saveProduct(data);
            if (!result.success) {
              console.error('[POS] Product save failed:', result.error);
              setSaveError(result.error || 'Failed to save');
              setSaving(false);
              return;
            }
          }
          
          // Update local
          if (product?.id) { for (const cat of Object.keys(PRODUCTS)) { const idx = PRODUCTS[cat].findIndex(p => p.id === product.id); if (idx >= 0) { PRODUCTS[cat][idx] = { ...PRODUCTS[cat][idx], ...data }; break; } } }
          else { if (!PRODUCTS[data.category]) PRODUCTS[data.category] = []; PRODUCTS[data.category].push(data); }
          setProducts({ ...PRODUCTS }); setSaving(false); onClose();
        };
        const handleDelete = async () => {
          if (confirm('Delete this product?')) {
            if (dbStatus.connected && dbStatus.tablesExist) await window.SUPABASE_POS.deleteProduct(product.id);
            for (const cat of Object.keys(PRODUCTS)) PRODUCTS[cat] = PRODUCTS[cat].filter(p => p.id !== product.id);
            setProducts({ ...PRODUCTS }); onClose();
          }
        };
        
        // Generate SKU from category + random
        const generateSKU = () => {
          const prefix = form.category.substring(0, 3).toUpperCase();
          const num = Math.floor(Math.random() * 90000) + 10000;

          <div style={styles.modal} onClick={onClose}><div style={{ ...styles.modalContent, maxWidth: '500px' }} onClick={e => e.stopPropagation()}>

            {dbStatus.connected && dbStatus.tablesExist && <div style={{ background: '#dcfce7', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', color: '#166534', marginBottom: '12px' }}>✓ Will sync to database</div>}
            {saveError && <div style={{ background: '#fef2f2', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', color: '#b91c1c', marginBottom: '12px' }}>❌ Error: {saveError}</div>}
            {vendorIds.length === 0 && <div style={{ background: '#fef3c7', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', color: '#92400e', marginBottom: '12px' }}>⚠️ No vendors found. Add a vendor first.</div>}
            <div style={{ display: 'grid', gap: '12px' }}>
              <div style={{ background: '#f0fdf4', padding: '12px', borderRadius: '8px' }}><label style={{ fontSize: '12px', fontWeight: '600', color: '#0f6e56' }}>Vendor</label><select style={{ ...styles.input, marginTop: '6px' }} value={form.vendorId} onChange={e => setForm({ ...form, vendorId: e.target.value })}>{Object.values(vendors).map(v => <option key={v.id} value={v.id}>{v.name} ({v.commissionRate}%)</option>)}</select></div>
              <input style={styles.input} placeholder="Product name *" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '11px', color: '#666' }}>Category</label><select style={styles.input} value={form.category} onChange={e => setForm({ ...form, category: e.target.value })}>{CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</select></div><div><label style={{ fontSize: '11px', color: '#666' }}>Stock</label><input style={styles.input} type="number" value={form.stock} onChange={e => setForm({ ...form, stock: e.target.value })} /></div></div>

                    <div><label style={{ fontSize: '10px', color: '#666' }}>Markup %</label><input style={styles.input} type="number" value={form.markup || 50} onChange={e => updateCostMarkup('markup', e.target.value)} /></div>
                    <div><label style={{ fontSize: '10px', color: '#666' }}>Price</label><input style={{ ...styles.input, background: '#f3f4f6', fontWeight: '600' }} type="number" step="0.01" value={form.price} readOnly /></div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                    <div><label style={{ fontSize: '10px', color: '#666' }}>Cost (optional)</label><input style={styles.input} type="number" step="0.01" placeholder="0.00" value={form.cost || ''} onChange={e => setForm({ ...form, cost: e.target.value })} /></div>
                    <div><label style={{ fontSize: '10px', color: '#666' }}>Price *</label><input style={styles.input} type="number" step="0.01" placeholder="0.00" value={form.price} onChange={e => setForm({ ...form, price: e.target.value })} /></div>
                  </div>

                {form.cost && form.price && (
                  <div style={{ marginTop: '8px', fontSize: '10px', color: '#666', display: 'flex', justifyContent: 'space-between' }}>

                    <span>Profit: {(((parseFloat(form.price) - parseFloat(form.cost)) / parseFloat(form.price)) * 100).toFixed(1)}%</span>
                  </div>
                )}
              </div>
              
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '11px', color: '#666' }}>Unit Type</label><select style={styles.input} value={form.unitType} onChange={e => { const ut = UNIT_TYPES.find(u => u.id === e.target.value); setForm({ ...form, unitType: e.target.value, unit: ut.units[0] }); }}>{UNIT_TYPES.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}</select></div><div><label style={{ fontSize: '11px', color: '#666' }}>Unit</label><select style={styles.input} value={form.unit} onChange={e => setForm({ ...form, unit: e.target.value })}>{selectedUnitType?.units.map(u => <option key={u} value={u}>{u}</option>)}</select></div></div>
              <div><label style={{ fontSize: '11px', color: '#666' }}>SKU / Barcode</label><div style={{ display: 'flex', gap: '8px' }}><input style={{ ...styles.input, flex: 1 }} placeholder="e.g., VEG-12345" value={form.barcode} onChange={e => setForm({ ...form, barcode: e.target.value })} /><button type="button" style={{ ...styles.button, ...styles.secondaryBtn, padding: '8px 12px', fontSize: '11px' }} onClick={generateSKU}>🎲 Generate</button></div></div>
              <div><label style={{ fontSize: '11px', color: '#666' }}>Product Image</label><div style={{ display: 'flex', gap: '8px', marginBottom: '8px' }}><input style={{ ...styles.input, flex: 1 }} placeholder="https://example.com/image.jpg" value={form.image || ''} onChange={e => setForm({ ...form, image: e.target.value })} /><label style={{ ...styles.button, ...styles.secondaryBtn, padding: '8px 12px', fontSize: '11px', cursor: 'pointer', margin: 0 }} title="Browse files">📁<input type="file" accept="image/*" style={{ display: 'none' }} onChange={e => { const file = e.target.files?.[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const maxSize = 800; let w = img.width, h = img.height; if (w > maxSize || h > maxSize) { if (w > h) { h = h * maxSize / w; w = maxSize; } else { w = w * maxSize / h; h = maxSize; } } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); setForm({ ...form, image: canvas.toDataURL('image/jpeg', 0.8) }); }; img.src = ev.target.result; }; reader.readAsDataURL(file); } }} /></label><label style={{ ...styles.button, ...styles.secondaryBtn, padding: '8px 12px', fontSize: '11px', cursor: 'pointer', margin: 0 }} title="Take photo">📷<input type="file" accept="image/*" capture="environment" style={{ display: 'none' }} onChange={e => { const file = e.target.files?.[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => { const img = new Image(); img.onload = () => { const canvas = document.createElement('canvas'); const maxSize = 800; let w = img.width, h = img.height; if (w > maxSize || h > maxSize) { if (w > h) { h = h * maxSize / w; w = maxSize; } else { w = w * maxSize / h; h = maxSize; } } canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); setForm({ ...form, image: canvas.toDataURL('image/jpeg', 0.8) }); }; img.src = ev.target.result; }; reader.readAsDataURL(file); } }} /></label></div>{form.image && <div style={{ marginTop: '8px', textAlign: 'center' }}><img src={form.image} alt="Preview" style={{ maxWidth: '120px', maxHeight: '80px', borderRadius: '8px', objectFit: 'cover', border: '1px solid #ddd' }} onError={e => e.target.style.display = 'none'} /><button type="button" style={{ display: 'block', margin: '4px auto 0', fontSize: '10px', color: '#dc2626', background: 'none', border: 'none', cursor: 'pointer' }} onClick={() => setForm({ ...form, image: '' })}>✕ Remove</button></div>}</div>
              <div style={{ display: 'flex', gap: '10px', marginTop: '8px' }}>{product?.id && <button style={{ ...styles.button, ...styles.dangerBtn }} onClick={handleDelete}>Delete</button>}{product?.id && <button style={{ ...styles.button, background: '#6366f1', color: 'white' }} onClick={() => async () => {
                          var qty = parseInt(prompt('How many labels?', '1') || '0');
                          if (!qty || qty < 1) return;
                          var v = vendors[form.vendorId];
                          var zpl = window.LABEL_PRINTER.productLabel(form, v, labelConfig);
                          var ok = 0;
                          for (var qi = 0; qi < qty; qi++) {
                            var r = await window.LABEL_PRINTER.send(zpl);
                            if (r.success) ok++;
                            else { alert('Failed on label ' + (qi+1) + ': ' + r.msg); break; }
                            if (qty > 1) await new Promise(function(res){setTimeout(res,300);});
                          }
                          if (ok > 0) alert(ok + ' label' + (ok > 1 ? 's' : '') + ' sent!');
                        }} title="Print label">🏷️ Print</button>}<button style={{ ...styles.button, ...styles.secondaryBtn, flex: 1 }} onClick={onClose}>Cancel</button><button style={{ ...styles.button, ...styles.primaryBtn, flex: 2 }} onClick={handleSave} disabled={!form.name || !form.price || saving}>{saving ? 'Saving...' : 'Save'}</button></div>
            </div>
          </div></div>
        );

      // VENDOR EDIT MODAL
      const VendorEditModal = ({ vendor, onClose }) => {
        const [form, setForm] = useState(vendor || { name: '', type: 'consignment', commissionRate: 15, contact: '', paymentMethod: 'check', paymentTerms: 'net-15', color: '#666666', active: true });
        const [saving, setSaving] = useState(false);
        const [saveError, setSaveError] = useState(null);
        const handleSave = async () => {
          setSaving(true);
          setSaveError(null);
          const id = vendor?.id || form.name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
          const data = { ...form, id };
          
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.saveVendor(data);
            if (!result.success) {
              console.error('[POS] Vendor save failed:', result.error);
              setSaveError(result.error || 'Failed to save');
              setSaving(false);
              return;
            }
          }
          
          VENDORS[id] = data;
          setVendors({ ...VENDORS }); setSaving(false); onClose();
        };
        const handleDelete = async () => {
          if (!confirm('Delete this vendor? This cannot be undone if vendor has no transaction history.')) return;
          setSaving(true);
          setSaveError(null);
          
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.deleteVendor(vendor.id);
            if (!result.success) {
              setSaveError(result.error || 'Failed to delete');
              setSaving(false);
              return;
            }
            if (result.softDelete) {
              // Just mark as inactive locally
              VENDORS[vendor.id].active = false;
              setVendors({ ...VENDORS });
              alert('Vendor deactivated (has transaction history).');
            } else {
              // Remove from local
              delete VENDORS[vendor.id];
              setVendors({ ...VENDORS });
            }
          } else {
            delete VENDORS[vendor.id];
            setVendors({ ...VENDORS });
          }
          setSaving(false);
          onClose();
        };
        return (
          <div style={styles.modal} onClick={onClose}><div style={styles.modalContent} onClick={e => e.stopPropagation()}>
            <h2 style={{ margin: '0 0 20px', fontSize: '18px' }}>{vendor?.id ? '✏️ Edit Vendor' : '➕ New Vendor'}</h2>
            {dbStatus.connected && dbStatus.tablesExist && <div style={{ background: '#dcfce7', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', color: '#166534', marginBottom: '12px' }}>✓ Will sync to database</div>}
            {saveError && <div style={{ background: '#fef2f2', padding: '8px 12px', borderRadius: '8px', fontSize: '11px', color: '#b91c1c', marginBottom: '12px' }}>❌ Error: {saveError}</div>}
            <div style={{ display: 'grid', gap: '12px' }}>
              <input style={styles.input} placeholder="Vendor name *" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '11px', color: '#666' }}>Type</label><select style={styles.input} value={form.type} onChange={e => setForm({ ...form, type: e.target.value, commissionRate: e.target.value === 'owner' ? 0 : form.commissionRate })}><option value="owner">Farm Store</option><option value="consignment">Consignment</option></select></div><div><label style={{ fontSize: '11px', color: '#666' }}>Commission %</label><input style={styles.input} type="number" value={form.commissionRate} onChange={e => setForm({ ...form, commissionRate: parseFloat(e.target.value) || 0 })} disabled={form.type === 'owner'} /></div></div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}><div><label style={{ fontSize: '11px', color: '#666' }}>Payment</label><select style={styles.input} value={form.paymentMethod} onChange={e => setForm({ ...form, paymentMethod: e.target.value })}><option value="check">Check</option><option value="ach">ACH</option></select></div><div><label style={{ fontSize: '11px', color: '#666' }}>Terms</label><select style={styles.input} value={form.paymentTerms} onChange={e => setForm({ ...form, paymentTerms: e.target.value })}><option value="net-7">Net 7</option><option value="net-15">Net 15</option><option value="net-30">Net 30</option></select></div></div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}><label style={{ fontSize: '12px' }}>Color:</label><input type="color" value={form.color} onChange={e => setForm({ ...form, color: e.target.value })} style={{ width: '50px', height: '32px', border: 'none' }} /><label style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: '6px', fontSize: '12px' }}><input type="checkbox" checked={form.active} onChange={e => setForm({ ...form, active: e.target.checked })} /> Active</label></div>
              <div style={{ display: 'flex', gap: '10px', marginTop: '8px' }}>{vendor?.id && <button style={{ ...styles.button, ...styles.dangerBtn }} onClick={handleDelete} disabled={saving}>🗑️ Delete</button>}<button style={{ ...styles.button, ...styles.secondaryBtn, flex: 1 }} onClick={onClose}>Cancel</button><button style={{ ...styles.button, ...styles.primaryBtn, flex: 2 }} onClick={handleSave} disabled={!form.name || saving}>{saving ? 'Saving...' : 'Save'}</button></div>
            </div>
          </div></div>
        );
      };

      // CUSTOMER EDIT MODAL
      const CustomerEditModal = ({ customer, onClose }) => {
        const [form, setForm] = useState(customer || { 
          name: '', email: '', phone: '', cardUid: '', 
          accountType: 'regular', houseAccountBalance: 0, prepaidBalance: 0, 
          discountPercent: 0, doorAccess: false, doorAccessHours: '', notes: '', active: true 
        });
        const [saving, setSaving] = useState(false);
        const [saveError, setSaveError] = useState(null);
        
        const handleSave = async () => {
          setSaving(true);
          setSaveError(null);
          
          const data = {
            ...form,
            id: customer?.id || `cust_${Date.now()}`,
            houseAccountBalance: parseFloat(form.houseAccountBalance) || 0,
            prepaidBalance: parseFloat(form.prepaidBalance) || 0,
            discountPercent: parseFloat(form.discountPercent) || 0
          };
          
          if (dbStatus.connected && dbStatus.tablesExist) {
            const result = await window.SUPABASE_POS.saveCustomer(data);
            if (!result.success) {
              setSaveError(result.error || 'Failed to save');
              setSaving(false);
              return;
            }
          }
          
          // Update local state
          if (customer?.id) {
            setCustomers(prev => prev.map(c => c.id === customer.id ? data : c));
          } else {
            setCustomers(prev => [...prev, data]);
          }
          setSaving(false);
          onClose();
        };
        
        const handleDelete = async () => {
          if (!confirm('Delete this customer? This cannot be undone.')) return;
          setSaving(true);
          
          if (dbStatus.connected && dbStatus.tablesExist) {
            await window.SUPABASE_POS.deleteCustomer(customer.id);

          const PaymentModal = () => {
        const [processing, setProcessing] = useState(false);
        const [selectedCustomer, setSelectedCustomer] = useState(null);
        const [customerSearch, setCustomerSearch] = useState('');
        const [showCustomerLookup, setShowCustomerLookup] = useState(false);
        // Auto-populate customer when NFC card is tapped (watches state, doesn't touch onCardRead)
        const _prevLastCard = React.useRef(nfcReaderStatus.lastCard);
        React.useEffect(function() {
          var uid = nfcReaderStatus.lastCard;
          if (uid && uid !== _prevLastCard.current && !selectedCustomer) {
            _prevLastCard.current = uid;
            var found = customers.find(function(c) { return c.cardUid === uid; });
            if (found) setSelectedCustomer(found);
          }
        }, [nfcReaderStatus.lastCard]);

        // Find customer by phone, name, or card
        const lookupCustomer = (searchVal) => {
          const val = searchVal.toLowerCase();
          return customers.find(c => 
            c.phone?.includes(val) || 
            c.name?.toLowerCase().includes(val) || 
            c.cardUid?.toLowerCase() === val.toLowerCase()
          );
        };
        
        const completeSale = async (method, customerForPayment = null) => {
          setProcessing(true);
          
          // If using store card, verify balance and deduct
          if (method === 'store_card' && customerForPayment) {
            if (customerForPayment.prepaidBalance < cartTotal) {
              alert('Insufficient store card balance! Balance: $' + customerForPayment.prepaidBalance.toFixed(2));
              setProcessing(false);
              return;
            }
            // Deduct balance
            const newBalance = customerForPayment.prepaidBalance - cartTotal;
            const updatedCustomer = { ...customerForPayment, prepaidBalance: newBalance };
            
            if (dbStatus.connected && dbStatus.tablesExist) {
              await window.SUPABASE_POS.saveCustomer(updatedCustomer);
            }
            setCustomers(prev => prev.map(c => c.id === customerForPayment.id ? updatedCustomer : c));
          }
          
          // If using house account, add to balance
          if (method === 'account' && customerForPayment) {
            const newBalance = (customerForPayment.houseAccountBalance || 0) + cartTotal;
            const updatedCustomer = { ...customerForPayment, houseAccountBalance: newBalance };
            
            if (dbStatus.connected && dbStatus.tablesExist) {
              await window.SUPABASE_POS.saveCustomer(updatedCustomer);
            }
            setCustomers(prev => prev.map(c => c.id === customerForPayment.id ? updatedCustomer : c));
          }
          
          // Save to Supabase if connected
          if (dbStatus.connected && dbStatus.tablesExist) {
            const tx = {
              transaction_num: `TX${Date.now()}`,
              subtotal: cartTotal, tax_amount: 0, total: cartTotal,
              payment_method: method, status: 'completed',
              cashier_id: user.id, is_kiosk: view === 'kiosk',
              customer_id: customerForPayment?.id || null
            };
            const items = cart.map(item => ({
              product_id: item.id, vendor_id: item.vendorId,
              quantity: item.quantity, unit_price: item.price,
              line_total: item.total, commission_rate: item.commissionRate,
              commission_amt: item.total * (item.commissionRate / 100),
              is_weight: item.isWeight,
              unit_cost: item.cost || null
            }));
            await window.SUPABASE_POS.saveTransaction(tx, items);
          }
          
          // Update local - create transaction object with proper structure
          const newTx = { 
            id: `txn_${Date.now()}`, 
            date: new Date().toISOString(), 
            items: cart.map(item => ({ 
              productId: item.id, 
              name: item.name, 
              vendorId: item.vendorId, 
              quantity: item.quantity, 
              price: item.price,
              cost: item.cost,
              total: item.total,
              commissionAmt: item.total * (item.commissionRate / 100)
            })), 
            paymentMethod: method, 
            total: cartTotal, 
            cashier: user.name,
            customerId: customerForPayment?.id,
            customerName: customerForPayment?.name
          };
          TRANSACTIONS.push(newTx);
          setTransactions(prev => [...prev, newTx]);
          
          for (const item of cart) { for (const cat of Object.keys(PRODUCTS)) { const idx = PRODUCTS[cat].findIndex(p => p.id === item.id); if (idx >= 0) { PRODUCTS[cat][idx].stock = Math.max(0, PRODUCTS[cat][idx].stock - (item.isWeight ? 1 : item.quantity)); break; } } }
          // Snapshot receipt data BEFORE clearing cart state
          var _disc = customerForPayment ? (customerForPayment.discountPercent || 0) : 0;
          var _discAmt = cartTotal * (_disc / 100);
          var _finalTotal = cartTotal - _discAmt;
          var _receiptData = {
            total: _finalTotal, cartTotal: cartTotal,
            discount: _discAmt, discountPct: _disc,
            method: method,
            customer: customerForPayment ? customerForPayment.name : null,
            date: new Date().toLocaleString(),
            store: settings.storeName, footer: settings.receiptFooter,

              var d = entry[1];
              return { vendor: d.vendor ? d.vendor.name : entry[0], items: d.items.map(function(i) { return { ...i }; }) };
            })
          };
          setProducts({ ...PRODUCTS });
          setCart([]);
          setProcessing(false);
          setLastSale(_receiptData);
        };
        
        // Calculate discount if customer selected

              <div style={{ display: 'flex', gap: '5px', marginBottom: '16px', justifyContent: 'center', flexWrap: 'wrap' }}>{CATEGORIES.map(cat => <button key={cat.id} style={{ padding: '8px 14px', borderRadius: '16px', border: '2px solid ' + cat.color, background: selectedCategory === cat.id ? cat.color : 'white', color: selectedCategory === cat.id ? 'white' : cat.color, fontSize: '12px', fontWeight: '600', cursor: 'pointer', fontFamily: 'inherit' }} onClick={() => setSelectedCategory(cat.id)}>{cat.icon} {cat.name}</button>)}</div>

            </div>

.name}</div><div style={{ fontSize: '12px', color: '#888', marginTop: '2px' }}>{item.isWeight ? item.quantity.toFixed(2) + ' lb' : item.quantity} × ${item.price.toFixed(2)}</div></div><div style={{ display: 'flex', alignItems: 'center', gap: '10px', flexShrink: 0 }}><span style={{ fontWeight: '600', color: '#0f6e56', fontSize: '15px' }}>${item.total.toFixed(2)}</span><button style={{ width:'38px',height:'38px',borderRadius:'8px',border:'none',background:'#fef2f2',color:'#dc2626',cursor:'pointer',fontSize:'18px',display:'flex',alignItems:'center',justifyContent:'center' }} onClick={() => removeCartItem(item.cartId)}>✕</button></div></div>))}</div><div style={{ flexShrink: 0, background: 'white', borderTop: '2px solid #0f6e56', padding: '12px 20px 20px' }}><div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '12px', fontSize: '20px', fontWeight: '700' }}><span>Total</span><span style={{ color: '#0f6e56' }}>${cartTotal.toFixed(2)}</span></div><button style={{ ...styles.button, ...styles.primaryBtn, width: '100%', padding: '16px', fontSize: '16px' }} disabled={cart.length === 0} onClick={() => { setShowKioskCart(false); setShowPayment(true); }}>{t.pay} →</button></div></div></div>)}
            <div onClick={() => cart.length > 0 && setShowKioskCart(true)} style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', padding: '12px 16px', boxShadow: '0 -4px 20px rgba(0,0,0,0.12)', borderRadius: '20px 20px 0 0', cursor: cart.length > 0 ? 'pointer' : 'default' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px' }}><div><div style={{ fontSize: '12px', color: '#666' }}>{t.basket} ({cart.length})</div><div style={{ fontSize: '22px', fontWeight: '700', color: '#0f6e56' }}>${cartTotal.toFixed(2)}</div></div><div style={{ display: 'flex', gap: '8px', flexShrink: 0 }}><button style={{ ...styles.button, ...styles.secondaryBtn }} onClick={e => { e.stopPropagation(); setCart([]); }}>{t.clear}</button><button style={{ ...styles.button, ...styles.primaryBtn, padding: '10px 20px', whiteSpace: 'nowrap' }} disabled={cart.length === 0} onClick={e => { e.stopPropagation(); setShowPayment(true); }}>{t.pay} →</button></div></div></div>

              })}

      // INVENTORY VIEW
      const renderInventory = () => {
        const allProducts = Object.values(products).flat();
        const filtered = vendorFilter === 'all' ? allProducts : allProducts.filter(p => p.vendorId === vendorFilter);
        return (
          <div style={{ padding: '16px', maxWidth: '1400px', margin: '0 auto' }}>

                      var prods = filtered;

                      }

from flask_cors import CORS
import subprocess, os, glob

app = Flask(__name__)
CORS(app)

USB_DEVICE = '/dev/usb/lp0'  # Find with: ls /dev/usb/lp*
ALLOWED_QUEUES = ['ZD411']

@app.route('/status')
def status():
    try:
        result = subprocess.run(['lpstat', '-p'], capture_output=True, text=True, timeout=3)
        queues = [line.split()[1] for line in result.stdout.splitlines()
                  if line.startswith('printer')]
    except Exception:
        queues = []
    return jsonify({'online': True, 'queues': queues, 'version': '1.0'})

@app.route('/status')
def status():
    dev = next(iter(__import__('glob').glob('/dev/usb/lp*')), None)
    return jsonify({'online': True, 'usb_device': dev, 'version': '2.0'})

@app.route('/print', methods=['POST'])
def print_label():
    data  = request.get_json() or {}
    queue = data.get('queue', 'ZD411')
    zpl   = data.get('zpl', '')
    if not zpl:
        return jsonify({'error': 'No ZPL provided'}), 400
    # Try direct USB first (bypasses CUPS, most reliable for ZPL)
    dev = next(iter(__import__('glob').glob('/dev/usb/lp*')), None)
    if dev:
        try:
            with open(dev, 'wb') as f: f.write(zpl.encode('utf-8'))
            return jsonify({'message': 'Sent via USB ' + dev})
        except PermissionError:
            return jsonify({'error': 'Permission denied. Run: sudo usermod -a -G lp pi'}), 500
    # Fallback to CUPS lpr
    if queue not in ALLOWED_QUEUES:
        return jsonify({'error': 'No USB device and queue not allowed'}), 400
    try:
        proc = subprocess.run(['lpr', '-P', queue, '-o', 'raw'],
            input=zpl.encode('utf-8'), capture_output=True, timeout=10)
        if proc.returncode == 0:
            return jsonify({'message': 'Sent via CUPS ' + queue})
        return jsonify({'error': proc.stderr.decode()}), 500
    except Exception as e:
        return jsonify({'error': str(e)}), 500

if __name__ == '__main__':
    print('Print bridge running on http://localhost:5001')
    print('Allowed queues:', ALLOWED_QUEUES)
    app.run(host='0.0.0.0', port=5001, debug=False)`}</pre>
